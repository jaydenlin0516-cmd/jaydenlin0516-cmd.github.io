function renderPanel(type) {
  const title = byId('panelTitle');
  const body = byId('panelBody');
  let html = '';

  if (type === 'shop') {
    title.textContent = '🏪 商店';
    html += '<h3>魚竿</h3>';
    for (const [id, r] of Object.entries(RODS)) {
      const prev = prevKey(RODS, id);
      let btn;
      if (state.rodsOwned[id]) btn = '<button disabled>已擁有</button>';
      else if (prev && !state.rodsOwned[prev]) btn = `<button disabled>🔒 需先擁有「${RODS[prev].name}」</button>`;
      else btn = `<button onclick="buyRod('${id}')">購買 ${r.cost} 金幣</button>`;
      html += `<div class="card"><div><b>${r.name}</b>${rodAttrs(r)}</div>${btn}</div>`;
    }
    html += '<h3>魚餌（釣到魚會消耗1次）</h3>';
    for (const [id, b] of Object.entries(BAITS)) {
      const price = b.cost === 0 ? '免費' : (b.cost + ' 金幣');
      const btn = `<button onclick="buyBait('${id}')">補充 ${price}（+${b.bundle}）</button>`;
      html += `<div class="card"><div><b>${b.name}</b><div class="muted">${b.desc}</div></div>${btn}</div>`;
    }
    html += '<h3>解鎖釣點</h3>';
    for (const [id, s] of Object.entries(SPOTS)) {
      const prev = prevKey(SPOTS, id);
      const req = SPOT_REQ_FISH[id] || 0;
      const caught = (req > 0 && prev) ? countCaughtInSpot(prev) : 0;
      const gateOk = (req === 0) || (prev && caught >= req);
      let line = s.desc;
      if (req > 0 && prev) line += `｜需先捕獲「${SPOTS[prev].name}」${req} 種魚（${caught}/${req}）`;
      let btn;
      if (state.spotsUnlocked[id]) btn = '<button disabled>已解鎖</button>';
      else if (prev && !state.spotsUnlocked[prev]) btn = `<button disabled>🔒 需先解鎖「${SPOTS[prev].name}」</button>`;
      else if (!gateOk) btn = `<button disabled>🔒 圖鑑 ${caught}/${req}</button>`;
      else if (state.coins >= unlockPrice(s)) btn = `<button onclick="unlockSpot('${id}')">解鎖 ${unlockPrice(s)} 金幣</button>`;
      else btn = `<button disabled>🔒 ${unlockPrice(s)} 金幣</button>`;
      html += `<div class="card"><div><b>${s.name}</b><div class="muted">${line}</div></div>${btn}</div>`;
    }
    html += '<h3>道具</h3>';
    for (const [id, it] of Object.entries(ITEMS)) {
      html += `<div class="card"><div><b>${it.name}</b><div class="muted">${it.desc}</div></div><button onclick="buyItem('${id}')">購買 ${it.cost} 金幣</button></div>`;
    }
  }
  else if (type === 'inv') {
    title.textContent = '🎒 背包';
    html += '<h3>魚竿（點擊裝備）</h3>';
    for (const [id, r] of Object.entries(RODS)) {
      if (!state.rodsOwned[id]) continue;
      const cur = state.currentRod === id;
      html += `<div class="card"><div><b>${r.name}</b>${rodAttrs(r)}</div><button onclick="equipRod('${id}')" ${cur ? 'disabled' : ''}>${cur ? '使用中' : '裝備'}</button></div>`;
    }
    html += '<h3>魚餌（點擊裝備，剩餘為使用次數）</h3>';
    for (const [id, b] of Object.entries(BAITS)) {
      const cnt = state.baits[id] ?? 0;   // 修復：避免顯示 undefined
      const cur = state.currentBait === id;
      html += `<div class="card"><div><b>${b.name}</b><div class="muted">剩餘：${cnt}｜${b.desc}</div></div><button onclick="equipBait('${id}')" ${cur ? 'disabled' : ''}>${cur ? '使用中' : '裝備'}</button></div>`;
    }
    html += '<h3>魚獲（賣出換金幣）</h3>';
    let any = false;
    for (const [id, f] of Object.entries(FISH)) {
      const n = state.fishCaught[id];
      if (n <= 0) continue;
      any = true;

// 將魚畫到圖鑑的小畫布上（未捕獲顯示暗色剪影，捕獲後解鎖完整資訊）
function renderFishToCanvas(canvas, fishId, caught) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const savedCtx = ctx, savedS = S;
  const sa = lighting.ambient, sw = lighting.warm, sc = lighting.cool;
  ctx = c; S = 2;
  lighting.ambient = caught ? 1 : 0.12;   // 未捕獲：暗色剪影（部分遮蓋）
  lighting.warm = 0; lighting.cool = 0;
  try {
    c.fillStyle = '#10141f';
    c.fillRect(0, 0, canvas.width, canvas.height);
    drawFish(fishId, canvas.width / 2 / S, canvas.height / 2 / S + 1, 1, 0);
  } finally {
    ctx = savedCtx; S = savedS;
    lighting.ambient = sa; lighting.warm = sw; lighting.cool = sc;
  }
}

// 找出魚的分佈地點
function fishLocations(fishId) {
  const names = [];
  for (const s of Object.values(SPOTS)) {
    let has = !!(s.fish && s.fish[fishId]);
    if (!has && s.dirFish) has = !!(s.dirFish.left && s.dirFish.left[fishId]) || !!(s.dirFish.right && s.dirFish.right[fishId]);
    if (has) names.push(s.name);
  }
  return names.length ? names.join('、') : '未知';
}

// 圖鑑排序：先依稀有度（普通→稀有→大魚→傳說），再依「最早能在哪個釣點遇到」（釣點解鎖順序），最後依售價
const RARITY_ORDER = { 普通:0, 稀有:1, 大魚:2, 傳說:3 };
const SPOT_KEYS = Object.keys(SPOTS).sort((a, b) => SPOTS[a].unlockCost - SPOTS[b].unlockCost);   // 依解鎖費用排列即解鎖順序

function fishFirstSpot(fishId) {
  // 回傳該魚最早出現的釣點在解鎖順序中的索引（含海域左右朝向魚群）
  for (let i = 0; i < SPOT_KEYS.length; i++) {
    const s = SPOTS[SPOT_KEYS[i]];
    if (s.fish && s.fish[fishId]) return i;
    if (s.dirFish && ((s.dirFish.left && s.dirFish.left[fishId]) || (s.dirFish.right && s.dirFish.right[fishId]))) return i;
  }
  return SPOT_KEYS.length;
}

function sortedFishIds() {
  return Object.keys(FISH).sort((a, b) => {
    const ra = RARITY_ORDER[FISH[a].rarity] ?? 99;
    const rb = RARITY_ORDER[FISH[b].rarity] ?? 99;
    if (ra !== rb) return ra - rb;
    const sa = fishFirstSpot(a), sb = fishFirstSpot(b);
    if (sa !== sb) return sa - sb;
    return FISH[a].price - FISH[b].price;
  });
}

/* ---------- 背包魚缸 ---------- */

// 魚缸尺寸（依魚缸框實際大小動態計算，維持像素風且無失真）
let TANK_S = 8;                   // 魚缸像素方塊大小
let TANK_LW = 48;                 // 魚缸邏輯寬（格）
let TANK_LH = 26;                 // 魚缸邏輯高（格）

// 依魚缸框的顯示尺寸設定畫布解析度與像素方塊大小
function sizeTank() {
  const canvas = byId('fishTank');
  if (!canvas) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w <= 0 || h <= 0) return;
  if (canvas.width === w && canvas.height === h) return;   // 尺寸未變，不重置畫布
  canvas.width = w; canvas.height = h;
  TANK_S = Math.max(5, Math.min(16, Math.round(Math.min(w, h) / 70)));
  TANK_LW = Math.floor(w / TANK_S);
  TANK_LH = Math.floor(h / TANK_S);
}

let tankFish = [];                // 魚缸內游動的魚 {id, x, y, dir, speed, phase}
let tankBubbles = [];             // 魚缸泡泡 {x, y, r, sp, ph}
let tankAnimId = null;            // 魚缸動畫 requestAnimationFrame id
let tankLastT = 0;                // 上一幀時間（算 dt）
let tankHideTimer = null;         // 魚缸淡出後才真正隱藏的計時器

// 依背包魚獲建立魚缸魚群（每種魚最多 2 條）
function buildTankFish() {
  tankFish = [];
  for (const id in FISH) {
    const n = Math.min(state.fishCaught[id] || 0, 2);
    for (let i = 0; i < n; i++) {
      const m = FISH[id].size + 2;   // 魚放大 2× 後，半寬約等於 size
      tankFish.push({
        id,
        x: m + Math.random() * (TANK_LW - m * 2),
        y: 8 + Math.random() * (TANK_LH - 19),
        dir: Math.random() < 0.5 ? -1 : 1,
        speed: 1.2 + Math.random() * 2.2,
        phase: Math.random() * 6.28,
      });
    }
  }
}

// 產生一個泡泡（平滑上升，不抖動）
function spawnTankBubble() {
  tankBubbles.push({
    x: Math.random() * TANK_LW,
    y: TANK_LH + 0.5,
    r: 0.5 + Math.random() * 0.7,   // 半徑（格）
    sp: 1.2 + Math.random() * 2.0,  // 上升速度（格/秒）
    ph: Math.random() * 6.28,
  });
}

// 更新魚群位置（左右游動、撞到邊緣掉頭）＋泡泡
function updateTankFish(dt) {
  for (const f of tankFish) {
    f.x += f.dir * f.speed * dt;
    const m = FISH[f.id].size + 2;   // 魚放大 2× 後，半寬約等於 size
    if (f.dir > 0 && f.x > TANK_LW - m) f.dir = -1;
    else if (f.dir < 0 && f.x < m) f.dir = 1;
  }
  // 泡泡（平滑上升，避免抖動）
  if (tankBubbles.length < 24 && Math.random() < 0.18) spawnTankBubble();
  for (let i = tankBubbles.length - 1; i >= 0; i--) {
    const b = tankBubbles[i];
    b.y -= b.sp * dt;
    if (b.y < 1) tankBubbles.splice(i, 1);
  }
}

// 繪製魚缸（水底漸層＋沙地＋水草＋泡泡＋游動的魚）
function drawFishTank(t) {
  const canvas = byId('fishTank');
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const savedCtx = ctx, savedS = S;
  const sa = lighting.ambient, sw = lighting.warm, sc = lighting.cool;
  ctx = c; S = TANK_S;
  lighting.ambient = 1; lighting.warm = 0; lighting.cool = 0;
  try {
    const W2 = canvas.width, H2 = canvas.height;
    const g = c.createLinearGradient(0, 0, 0, H2);
    g.addColorStop(0, '#2a7aa8');
    g.addColorStop(0.7, '#124a6e');
    g.addColorStop(1, '#0e3a5c');
    c.fillStyle = g;
    c.fillRect(0, 0, W2, H2);
    // 光柱（靜止，從水面灑下）
    c.fillStyle = 'rgba(255,246,208,0.07)';
    for (let i = 0; i < 4; i++) {
      const lx = Math.floor(TANK_LW * (0.15 + i * 0.23));
      c.fillRect(lx * TANK_S, 0, Math.max(1, Math.floor(TANK_S * 0.6)), H2);
    }
    // 沙地
    fill(0, TANK_LH - 3, TANK_LW, 3, '#5a4a30');
    fill(0, TANK_LH - 3, TANK_LW, 1, '#8a7a50');
    // 沙地石子（固定種子，穩定不抖動）
    for (let i = 0; i < Math.floor(TANK_LW / 2.5); i++) {
      const x = Math.floor(seededRand(i * 31 + 7) * TANK_LW);
      const s = seededRand(i * 17 + 3) > 0.7 ? 2 : 1;
      fill(x, TANK_LH - 2, s, 1, i % 2 ? '#6a5a40' : '#7a6a50');
    }
    // 後景水草（高、深色）
    for (let i = 0; i < Math.floor(TANK_LW / 6); i++) {
      const x = 3 + i * 6;
      const h = 7 + (i % 3) * 3;
      fill(x, TANK_LH - 3 - h, 1, h, '#1e5a3a');
      fill(x, TANK_LH - 3 - h, 1, 1, '#3a8a5a');
    }
    // 前景水草（較矮、亮色）
    const plants = Math.max(4, Math.floor(TANK_LW / 10));
    for (let i = 0; i < plants; i++) {
      const x = 5 + Math.floor(i * (TANK_LW - 10) / (plants - 1));
      const h = 4 + (i % 3) * 2;
      fill(x, TANK_LH - 3 - h, 1, h, '#2a7a4a');
      fill(x, TANK_LH - 3 - h, 1, 1, '#4aaa6a');
    }
    // 珊瑚叢
    const corals = ['#e8788a', '#e8a878', '#a878e8'];
    for (let i = 0; i < 3; i++) {
      const cx = 3 + Math.floor(seededRand(i * 13 + 5) * (TANK_LW - 6));
      const ch = 3 + Math.floor(seededRand(i * 29 + 7) * 2);
      for (let j = 0; j < ch; j++) fill(cx + (j % 2), TANK_LH - 2 - j, 1, 1, corals[i % 3]);
    }
    // 泡泡（平滑上升，不抖動）
    for (const b of tankBubbles) {
      const bx = b.x + Math.sin(t * 1.5 + b.ph) * 0.25;
      const r = Math.max(1, Math.round(b.r * TANK_S * 0.6));
      c.fillStyle = 'rgba(255,255,255,0.4)';
      c.fillRect(Math.round(bx * TANK_S), Math.round(b.y * TANK_S), r, r);
    }
    // 魚（上下微微浮動，縮小顯示）
    for (const f of tankFish) {
      const fy = f.y + Math.sin(t * 2 + f.phase) * 0.5;
      ctx.save();
      ctx.translate(f.x * S, fy * S);
      ctx.scale(0.6, 0.6);
      ctx.translate(-f.x * S, -fy * S);
      drawFish(f.id, f.x, fy, f.dir, t);
      ctx.restore();
    }
  } finally {
    ctx = savedCtx; S = savedS;
    lighting.ambient = sa; lighting.warm = sw; lighting.cool = sc;
  }
}

function startFishTank() {
  const canvas = byId('fishTank');
  if (!canvas) return;
  sizeTank();
  buildTankFish();
  if (tankAnimId) return;   // 已在動畫中，只重建魚群與畫布
  tankLastT = performance.now();
  const tick = (now) => {
    const dt = Math.min(0.05, (now - tankLastT) / 1000);
    tankLastT = now;
    updateTankFish(dt);
    drawFishTank(now / 1000);
    tankAnimId = requestAnimationFrame(tick);
  };
  tankAnimId = requestAnimationFrame(tick);
}

function stopFishTank() {
  if (tankAnimId) { cancelAnimationFrame(tankAnimId); tankAnimId = null; }
  tankBubbles = [];
}

// 顯示魚缸（取消淡出，套用淡入動畫）
function showFishTank() {
  const box = byId('fishTankBox');
  clearTimeout(tankHideTimer);
  box.classList.remove('fading-out');
  box.classList.remove('hidden');
}

// 隱藏魚缸（先淡出，再真正隱藏並停止動畫）
function hideFishTank() {
  const box = byId('fishTankBox');
  if (!box) return;
  if (box.classList.contains('hidden')) { stopFishTank(); return; }   // 已隱藏：直接停止（例如啟動時的預先渲染）
  box.classList.add('fading-out');
  clearTimeout(tankHideTimer);
  tankHideTimer = setTimeout(() => {
    box.classList.add('hidden');
    box.classList.remove('fading-out');
    stopFishTank();
  }, 180);
}

// 視窗尺寸改變時，若魚缸正在顯示，重新計算尺寸與魚群
window.addEventListener('resize', () => { if (tankAnimId) { sizeTank(); buildTankFish(); tankBubbles = []; } });

/* ---------- 素材匯出（PNG） ---------- */
function assetCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function downloadPNG(canvas, filename) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename + '.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// 場景類素材（設定 LW/LH/waterY/landW/fisherX，畫完還原）
function withScene(w, h, fn) {
  const c = assetCanvas(w, h);
  const cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;   // 最近鄰採樣，保持像素銳利
  const savedCtx = ctx, savedS = S, savedW = W, savedH = H;
  const savedLW = LW, savedLH = LH, savedWaterY = waterY, savedLandW = landW, savedFisherX = fisherX;
  ctx = cc; S = 4; W = w; H = h;
  LW = Math.ceil(W / S); LH = Math.ceil(H / S);
  waterY = Math.round(LH * 0.5); landW = Math.max(12, Math.round(LW * 0.26)); fisherX = Math.round(landW * 0.38);
  try { fn(c); }
  finally { ctx = savedCtx; S = savedS; W = savedW; H = savedH; LW = savedLW; LH = savedLH; waterY = savedWaterY; landW = savedLandW; fisherX = savedFisherX; }
  return c;
}

// 精靈類素材（透明底、中性光照）
function withSprite(w, h, fn) {
  const c = assetCanvas(w, h);
  const cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;   // 最近鄰採樣，保持像素銳利
  const savedCtx = ctx, savedS = S;
  const sa = lighting.ambient, sw = lighting.warm, sc = lighting.cool;
  ctx = cc; S = 4;
  lighting.ambient = 1; lighting.warm = 0; lighting.cool = 0;
  try { fn(c); }
  finally { ctx = savedCtx; S = savedS; lighting.ambient = sa; lighting.warm = sw; lighting.cool = sc; }
  return c;
}

function renderCoverAsset() { return withScene(1280, 720, () => drawCoverScene(0)); }
function renderVictoryAsset() { return withScene(1280, 720, () => drawVictoryScene(0)); }
function renderMapAsset(id) { const c = assetCanvas(192, 112); renderMapPreview(c, id); return c; }
function renderFishAsset(id) { return withSprite(192, 96, () => drawFish(id, 24, 12, 1, 0)); }
// 像素直線（以 fillRect 繪製，避免 stroke 抗鋸齒，導出 PNG 更銳利）
function pixelLine(x0, y0, x1, y1, color, thick) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0, w = Math.max(1, thick || 1);
  while (true) {
    fill(x, y, w, 1, color);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}

function renderRodAsset(id) {
  return withSprite(192, 96, () => {
    const rod = RODS[id];
    const thick = rod.reel >= 3.3 ? 3 : 2;
    pixelLine(12, 20, 72, 4, rod.color, thick);          // 竿身
    pixelLine(68, 6, 72, 4, rod.tip, 2);                 // 竿尖
    fill(12, 18, 3, 3, rod.reelColor);                   // 捲線器
    fill(12, 18, 3, 1, shade(rod.reelColor, 1.25, 0));
    if (rod.special === 'legend' || rod.special === 'star' || rod.special === 'myth') {
      fill(72, 2, 3, 3, '#fff6c0');
      fill(74, 4, 2, 2, rod.special === 'star' ? '#e0c0ff' : '#ffe066');
    }
  });
}
function renderCharAsset(pose) {
  return withSprite(128, 160, () => {
    const savedPhase = phase, savedHolding = holding, savedSpot = state.currentSpot, savedWaterY = waterY, savedFisherX = fisherX;

function renderParticleAsset(kind) {
  return withSprite(64, 64, () => {
    if (kind === 'ripple') {
      const r = 6, pts = [[1,0],[-1,0],[0,1],[0,-1],[0.7,0.7],[0.7,-0.7],[-0.7,0.7],[-0.7,-0.7]];
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (const [dx,dy] of pts) ctx.fillRect(Math.round((8 + dx * r) * S), Math.round((8 + dy * r) * S), S, S);
    } else if (kind === 'bubble') { ellipse(8, 8, 6, 6, 'rgba(200,230,255,0.8)'); fill(6, 6, 2, 2, '#ffffff'); }
    else if (kind === 'spray') { fill(6, 3, 2, 2, 'rgba(215,238,255,0.9)'); fill(8, 7, 2, 2, 'rgba(215,238,255,0.7)'); fill(4, 9, 2, 2, 'rgba(215,238,255,0.6)'); }
    else if (kind === 'mist') { fill(4, 6, 8, 4, 'rgba(210,220,230,0.5)'); fill(8, 4, 6, 4, 'rgba(210,220,230,0.4)'); }
    else if (kind === 'glint') { fill(8, 8, 2, 2, '#ffffff'); fill(6, 8, 2, 2, 'rgba(255,255,255,0.5)'); }
    else if (kind === 'energy') { fill(6, 6, 4, 4, '#e0c0ff'); fill(8, 8, 2, 2, '#ffffff'); }
  });
}

function collectAssets() {

  for (const pose of ['idle','cast','reel','caught']) list.push({ name: 'char_' + pose, label: '人物_' + pose, type: '人物', desc: '角色姿勢', render: () => renderCharAsset(pose) });
  for (const id in FISH) list.push({ name: 'fish_' + id, label: '魚_' + FISH[id].name, type: '魚種', desc: FISH[id].rarity, render: () => renderFishAsset(id) });
  for (const id in RODS) list.push({ name: 'rod_' + id, label: '釣竿_' + RODS[id].name, type: '釣竿', desc: RODS[id].desc, render: () => renderRodAsset(id) });
  for (const kind of ['panel','card','button','bar','chip','title']) list.push({ name: 'ui_' + kind, label: 'UI_' + kind, type: 'UI', desc: '介面元件', render: () => renderUIAsset(kind) });
  for (const kind of ['coin','fish','bait','anchor','bobber','trophy','sound','gear']) list.push({ name: 'icon_' + kind, label: '圖示_' + kind, type: '圖示', desc: '介面圖示', render: () => renderIconAsset(kind) });
  for (const kind of ['ripple','bubble','spray','mist','glint','energy']) list.push({ name: 'particle_' + kind, label: '粒子_' + kind, type: '粒子', desc: '特效粒子', render: () => renderParticleAsset(kind) });
  return list;
}

let exportRows = [];   // 目前匯出佇列（含已渲染畫布）

// 點「下載PNG」：先渲染並展示素材清單，再自動批量下載（無需再確認）
function startAssetExport() {
  exportRows = collectAssets().map(a => {
    try {
      const c = a.render();
      return { name: a.name, label: a.label, type: a.type, desc: a.desc, canvas: c, w: c.width, h: c.height, ok: true };
    } catch (e) {
      return { name: a.name, label: a.label, type: a.type, desc: a.desc, canvas: null, w: 0, h: 0, ok: false };
    }
  });
  byId('exportCount').textContent = exportRows.length;
  byId('exportList').innerHTML = exportRows.map(r =>
    `<div class="er-row"><span>${r.label}</span><span>${r.type}</span><span>${r.w}×${r.h}</span><span>${r.desc}</span></div>`
  ).join('');
  byId('exportStatus').textContent = '清單已列出，開始自動下載…';
  byId('exportOverlay').classList.remove('hidden');
  setTimeout(downloadExportQueue, 600);
}

// 依序下載全部素材，結束後輸出匯出報告
function downloadExportQueue() {
  let ok = 0; const failed = [];
  const total = exportRows.length;
  exportRows.forEach((r, i) => {
    setTimeout(() => {
      try {
        if (!r.ok || !r.canvas) throw new Error('render failed');
        downloadPNG(r.canvas, r.name);
        ok++;
      } catch (e) { failed.push(r.label); }
      if (i === total - 1) {
        byId('exportStatus').innerHTML = '✅ 成功 ' + ok + ' 張' + (failed.length ? '<br>⚠ 異常/跳過：' + failed.join('、') : '');
      }
    }, i * 350);
  });
}

function closeExportOverlay() { byId('exportOverlay').classList.add('hidden'); }

// 封面標題像素字體貼圖（透明底）：低解析度畫字 → 二值化去鋸齒 → 最近鄰放大 → 加藍色像素點綴
function renderCoverTitleAsset() {
  const chText = '漁夫瑟蘭', enText = 'Seran Fisher';
  const chSize = 20, enSize = 11, scale = 4, gap = 8, padY = 14, spacing = 10;
  const chH = Math.round(chSize * 1.2), enH = Math.round(enSize * 1.2);

  // 量測文字寬度（與畫字用同一字型，確保置中一致）
  const mc = document.createElement('canvas').getContext('2d');
  mc.font = 'bold ' + chSize + 'px "Microsoft JhengHei", "微軟正黑體", "Courier New", monospace';
  const chW = Math.ceil(mc.measureText(chText).width);
  mc.font = enSize + 'px "Courier New", monospace';
  const enW = Math.ceil(mc.measureText(enText).width);

  const baseW = chW * 3;                       // 中文約占整體 1/3
  const baseH = padY + chH + gap + enH + padY;

  // 低解析度畫布：白字、透明底
  const base = assetCanvas(baseW, baseH);
  const bc = base.getContext('2d');
  bc.fillStyle = '#ffffff';
  bc.textBaseline = 'top';
  bc.textAlign = 'left';
  bc.font = 'bold ' + chSize + 'px "Microsoft JhengHei", "微軟正黑體", "Courier New", monospace';
  const chX = Math.floor((baseW - chW) / 2);
  bc.fillText(chText, chX, padY);
  bc.font = enSize + 'px "Courier New", monospace';
  const enX = Math.floor((baseW - enW) / 2);
  bc.fillText(enText, enX, padY + chH + gap);

  // 二值化：去除抗鋸齒，產生清晰像素方塊鋸齒（無漸層、無陰影、無發光）
  const imgData = bc.getImageData(0, 0, baseW, baseH);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] > 128) { d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = 255; }
    else { d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 0; }
  }
  bc.putImageData(imgData, 0, 0);

  // 最近鄰放大
  const big = assetCanvas(baseW * scale, baseH * scale);
  const bg = big.getContext('2d');
  bg.imageSmoothingEnabled = false;
  bg.drawImage(base, 0, 0, big.width, big.height);

  // 少量藍／深藍像素格點綴：中文標題左右各一顆十字像素星
  const BLUE = '#3f8fd8', DARKBLUE = '#1a3a6a';
  const cy = (padY + Math.floor(chH / 2)) * scale;
  const cxList = [(chX - spacing) * scale, (chX + chW + spacing) * scale];
  for (const cx of cxList) {
    bg.fillStyle = BLUE;
    bg.fillRect(cx - scale, cy, scale, scale);
    bg.fillRect(cx + scale, cy, scale, scale);
    bg.fillRect(cx, cy - scale, scale, scale);
    bg.fillRect(cx, cy + scale, scale, scale);
    bg.fillStyle = DARKBLUE;
    bg.fillRect(cx, cy, scale, scale);
  }
  return big;
}

// 預覽封面標題（畫在深色底上，匯出前供玩家確認）

}

// 地圖預覽縮圖（畫到地圖卡片的小畫布，用既有繪圖函式保持美術一致）
function renderMapPreview(canvas, spotId) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  // 保存全域狀態
  const savedCtx = ctx, savedS = S, savedW = W, savedH = H;
  const savedLW = LW, savedLH = LH, savedWaterY = waterY, savedLandW = landW, savedFisherX = fisherX;
  const savedSpot = state.currentSpot, savedTime = timeOfDay;
  const sc = weather.cloud, sr = weather.rain, sf = weather.fog;

  // 切換到小畫布與目標釣點，用固定白晝晴天
  ctx = c; S = 3;
  W = canvas.width; H = canvas.height;
  LW = Math.ceil(W / S); LH = Math.ceil(H / S);
  waterY = Math.round(LH * 0.5);
  landW = Math.max(8, Math.round(LW * 0.28));
  fisherX = Math.round(landW * 0.38);
  state.currentSpot = spotId;
  timeOfDay = 0.5;
  weather.cloud = 0; weather.rain = 0; weather.fog = 0;
  computeLighting();

  try {
    if (spotId === 'underwater') {
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0e3a50'); g.addColorStop(0.6, '#082a3c'); g.addColorStop(1, '#041a28');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      const seabed = Math.round(LH * 0.82);
      fill(0, seabed, LW, LH - seabed, '#1a3a48');
      for (let i = 0; i < 4; i++) { const rx = 2 + Math.floor(seededRand(i * 7 + 11) * (LW - 6)); fill(rx, seabed - 2, 3, 2, '#2a4a58'); }
      for (let i = 0; i < 4; i++) { const kx = 3 + i * 7, kh = 3 + (i % 2) * 2; fill(kx, seabed - kh, 1, kh, shade('#2a7a4a', 1, 0)); }
      drawVortex(0);
      drawFish('angler', Math.round(LW * 0.32), Math.round(LH * 0.4), -1, 0);
      drawFish('jelly', Math.round(LW * 0.66), Math.round(LH * 0.34), -1, 0);
    } else {
      drawSky();
      drawWaterBase();
      drawDecor(0);
      drawTerrain();
      const wl = waterLeft();
      const fishes = { river:'crucian', lake:'carp', swamp:'puffer', pier:'tuna', sea:'dolphin', sky:'rainbow', glow:'koi' };
      drawFish(fishes[spotId] || 'crucian', wl + 5, waterY + 3, -1, 0);
    }
  } finally {
    ctx = savedCtx; S = savedS; W = savedW; H = savedH;
    LW = savedLW; LH = savedLH; waterY = savedWaterY; landW = savedLandW; fisherX = savedFisherX;
    state.currentSpot = savedSpot; timeOfDay = savedTime;
    weather.cloud = sc; weather.rain = sr; weather.fog = sf;
    computeLighting();
  }
}

function drawCover() {
  const cv = byId('coverCanvas');
  if (!cv) return;
  const c = cv.getContext('2d');
  const W2 = cv.width, H2 = cv.height;
  // 黃昏天空（暖金到深藍）
  const sky = c.createLinearGradient(0, 0, 0, H2 * 0.52);
  sky.addColorStop(0, '#2a3a5c'); sky.addColorStop(0.5, '#c86a4a'); sky.addColorStop(1, '#ffc060');
  c.fillStyle = sky; c.fillRect(0, 0, W2, H2 * 0.52);
  // 夕陽
  c.fillStyle = '#ffe08a'; c.fillRect(W2 * 0.72, H2 * 0.3, 22, 22);
  // 海面（金色波光）
  const sea = c.createLinearGradient(0, H2 * 0.52, 0, H2);
  sea.addColorStop(0, '#c87a3a'); sea.addColorStop(1, '#3a5a7a');
  c.fillStyle = sea; c.fillRect(0, H2 * 0.52, W2, H2 * 0.48);
  c.fillStyle = 'rgba(255,200,120,0.5)';
  for (let i = 0; i < 4; i++) c.fillRect(W2 * 0.45, H2 * 0.56 + i * 14, W2 * 0.5, 3);
  // 左下：主角瑟蘭（持竿立繪）
  drawCoverFisherman(c, 40, H2 - 78);
  // 右側：躍出的傳說魚
  const savedCtx = ctx, savedS = S;
  const sa = lighting.ambient, sw = lighting.warm, sc = lighting.cool;
  ctx = c; S = 5;
  lighting.ambient = 1; lighting.warm = 0.4; lighting.cool = 0;
  try {
    drawFish('dragon', W2 * 0.68 / S, H2 * 0.48 / S, 1, 0);
    drawFish('koi', W2 * 0.5 / S, H2 * 0.74 / S, -1, 0);
    drawFish('clown', W2 * 0.82 / S, H2 * 0.68 / S, -1, 0);
  } finally {
    ctx = savedCtx; S = savedS;
    lighting.ambient = sa; lighting.warm = sw; lighting.cool = sc;
  }
  // 水花
  c.fillStyle = 'rgba(220,240,255,0.7)';
  for (let i = 0; i < 5; i++) c.fillRect(W2 * 0.62 + i * 6, H2 * 0.56, 4, 4);
}

// 封面主角瑟蘭（持竿像素立繪）
function drawCoverFisherman(c, x, y) {
  const P = 5;   // 像素方塊大小
  const px = (xx, yy, ww, hh, col) => { c.fillStyle = col; c.fillRect(x + xx * P, y + yy * P, ww * P, hh * P); };
  // 帽子
  px(1, 0, 6, 2, '#3a6ea5'); px(0, 2, 8, 1, '#27476e'); px(1, 1, 2, 1, '#e8b830');
  // 頭
  px(2, 3, 4, 4, '#f2c894'); px(5, 4, 1, 1, '#1a1a1a');
  // 身體（紅褐背心）
  px(1, 7, 6, 6, '#8a4a2a'); px(1, 7, 6, 1, '#6a3a1e');
  // 手臂 + 釣竿
  px(7, 8, 3, 2, '#f2c894');
  c.strokeStyle = '#7a4a2a'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(x + 8 * P, y + 8 * P); c.lineTo(x + 18 * P, y + 1 * P); c.stroke();
  // 腿
  px(2, 13, 2, 6, '#3a4a6a'); px(5, 13, 2, 6, '#3a4a6a');
}

    if (k === 'Escape') { rebindAction = null; renderPanel(panelType); return; }
    state.keybinds[rebindAction] = k;
    rebindAction = null;
    saveGame();
    renderPanel(panelType);
    return;
  }
  if (inMenu) return;   // 主選單期間忽略快捷鍵
  const kb = state.keybinds || DEFAULT_KEYBINDS;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === kb.reel) { if (phase === 'fight') { e.preventDefault(); holding = true; } }
  else if (key === kb.inv) togglePanel('inv');
  else if (key === kb.shop) togglePanel('shop');
  else if (key === kb.map) togglePanel('map');
  else if (key === kb.enc) togglePanel('enc');
  else if (key === kb.meta) togglePanel('meta');
  else if (key === kb.custom) togglePanel('custom');
  else if (key === kb.boat) toggleBoatDir();
  else if (key === kb.water) toggleWaterParticles();
  else if (key === kb.sound) toggleSound();
  else if (key === kb.ui) toggleUi();
  else if (key === kb.close) closePanel();
});
window.addEventListener('keyup', (e) => {
  const kb = state.keybinds || DEFAULT_KEYBINDS;
  if (e.key.toLowerCase() === kb.reel) holding = false;
});

const reelBtn = byId('reelBtn');
reelBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if (phase === 'fight') holding = true; });
reelBtn.addEventListener('mouseup', () => holding = false);
reelBtn.addEventListener('mouseleave', () => holding = false);
reelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (phase === 'fight') holding = true; });
reelBtn.addEventListener('touchend', () => holding = false);
reelBtn.addEventListener('touchcancel', () => holding = false);   // 觸控被中斷也要放開收線

window.addEventListener('beforeunload', saveGame);
document.addEventListener('click', (e) => { if (e.target && e.target.tagName === 'BUTTON') sfxClick(); });   // UI 點擊音效
// UI 選取音效：滑鼠移入 / 觸碰任意 UI 元件時播放（水滴雙音）
document.addEventListener('pointerover', (e) => {
  const sel = 'button, a, .menu-btn, .menu-link, input, select';
  const el = e.target && e.target.closest ? e.target.closest(sel) : null;
  if (!el) return;
  const from = e.relatedTarget;
  if (from && from.closest && from.closest(sel) === el) return;   // 仍在同一元件內移動，不重複播放
  sfxHover();
});
window.addEventListener('pointerdown', firstInteract, { once: true });
window.addEventListener('keydown', firstInteract, { once: true });

/* ---------- 十二、主迴圈 ---------- */

let lastT = performance.now();

function update(dt, t) {
  state.playTime += dt;   // 累計遊戲時間（存檔摘要用）
  // 海底場景：不推進晝夜、不變化天氣（維持固定水底環境）
  if (state.currentSpot !== 'underwater') {
    timeOfDay = (timeOfDay + dt * TIME_SPEED) % 1;   // 時間循環推進
    updateWeather(dt);                                 // 天氣平滑過渡
  }
  computeLighting();                                 // 由時間 + 天氣計算光照

  // 淡入淡出
  if (fading) {
    fade += fadeDir * dt * 2.5;
    if (fadeDir === 1 && fade >= 1) { fade = 1; fadeDir = -1; applySpot(pendingSpot); }
    else if (fadeDir === -1 && fade <= 0) { fade = 0; fading = false; }
  }

  // 拋竿動畫
  if (phase === 'cast') {
    const p = clamp((performance.now() - castStart) / 500, 0, 1);
    castP = p;   // 拋竿進度（供甩竿動畫）
    bobber.x = lerp(getRodTip().x, bobber.tx, p);
    bobber.y = lerp(getRodTip().y, bobber.ty, p) - Math.sin(p * Math.PI) * 3; // 拋物線
    if (p >= 1) { phase = 'waiting'; sfxSplash(); spawnSplash(bobber.tx, waterY); clearTimeout(biteTimer); biteTimer = setTimeout(onBite, castBiteWait); }
  }

  // 拉扯
  if (phase === 'fight') { updateFight(dt); updateFightUI(); }

  // 水流：浮漂隨流漂動、魚隨流游動（海域平緩、海底強烈）
  const flow = flowSpeed();
  if ((phase === 'waiting' || phase === 'fight') && flow > 0) {
    bobber.tx += flow * dt;
    bobber.tx = clamp(bobber.tx, waterLeft() + 1, LW - 1);
  }

  // 環境魚移動
  const leftBound = state.currentSpot === 'underwater' ? 1 : waterLeft() + 2;
  for (const f of ambient) {
    f.x += f.dir * f.speed * dt + flow * dt;   // 水流推動魚
    if (f.x < leftBound) f.dir = 1;
    if (f.x > LW - 4) f.dir = -1;
  }

  // 泡泡（海底漩渦地圖移除氣泡特效）
  if (state.currentSpot !== 'underwater' && Math.random() < 0.05) spawnBubble();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.sp * dt * 3;
    b.x += flow * dt * 0.6;   // 水下粒子隨水流漂動
    if (b.y < waterY + 1) bubbles.splice(i, 1);
  }

  // 雨滴（小雨時飄落）
  if (weather.rain > 0.05 && Math.random() < weather.rain * 0.5) {
    raindrops.push({ x: Math.random() * LW, y: -2 - Math.random() * 4, sp: 42 + Math.random() * 26, len: 2 + Math.random() * 3 });
  }
  for (let i = raindrops.length - 1; i >= 0; i--) {
    const d = raindrops[i];
    d.y += d.sp * dt;
    if (d.y > LH) raindrops.splice(i, 1);
  }
  // 雨滴漣漪（落在水面，會擴散淡出）
  if (weather.rain > 0.3 && Math.random() < weather.rain * 0.3) {
    ripples.push({ x: waterLeft() + Math.random() * (LW - waterLeft()), y: waterY + 2 + Math.random() * 10, r: 0.5, sp: 2 + Math.random() * 2, alpha: 0.4 });
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += r.sp * dt;
    r.alpha -= dt * 0.7;
    if (r.alpha <= 0) ripples.splice(i, 1);
  }

  // 隨機事件
  if (!inMenu) {
    eventTimer -= dt;
    if (eventTimer <= 0 && phase === 'idle') { eventTimer = 25 + Math.random() * 30; triggerRandomEvent(); }
    for (let i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t >= fx[i].dur) fx.splice(i, 1); }
    // 夜間偶發流星
    if (lighting.cool > 0.5 && Math.random() < 0.002) {
      fx.push({ type: 'star', x: Math.random() * LW * 0.7, y: Math.random() * waterY * 0.4, t: 0, dur: 1.2 });
    }
    // 限時稀有魚事件
    rareEventTimer -= dt;
    if (rareEventTimer <= 0 && phase === 'idle') { rareEventTimer = 90 + Math.random() * 90; triggerRareEvent(); }
    if (rareEvent && performance.now() >= rareEvent.until) rareEvent = null;
  }
  // 水體粒子（開啟時生成；無論如何都更新以清空舊粒子）
  if (waterParticlesOn && !inMenu) { spawnRegionWater(); spawnRodFx(); }
  for (let i = waterParticles.length - 1; i >= 0; i--) {
    const p = waterParticles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) waterParticles.splice(i, 1);
  }
  // 環境粒子：光塵 / 螢火蟲 / 落葉 / 閃電白光
  if (!inMenu) {
    if (Math.random() < 0.06) spawnMotes();
    if (Math.random() < 0.05) spawnFireflies();
    if (Math.random() < 0.02) spawnLeaves();
    updateMotes(dt); updateFireflies(dt); updateLeaves(dt);
    flash = Math.max(0, flash - dt * 3);
  }

  // 環境音（雨/風/水面）＋雷聲＋船體吱嘎＋鳥鳴/蟲鳴/水波
  ambientTimer -= dt;
  if (ambientTimer <= 0) {
    ambientTimer = 0.4;
    updateAmbient();
    if (weather.rain > 0.5 && Math.random() < 0.04) { sfxThunder(); flash = 1; }   // 打雷＋閃電白光
    if (state.currentSpot === 'sea' && Math.random() < 0.12) sfxCreak();
    byId('hudMarket').textContent = marketRate().toFixed(2);   // 魚市價格顯示
    if (!inMenu) {
      const spot = SPOTS[state.currentSpot];
      const isLand = spot.type === 'land' || spot.type === 'lake' || spot.type === 'swamp' || state.currentSpot === 'glow';
      if (isLand && lighting.daylight > 0.5 && Math.random() < 0.08) sfxBird();     // 白天鳥鳴
      if (isLand && lighting.cool > 0.4 && Math.random() < 0.1) sfxCricket();       // 夜晚蟲鳴
      if (Math.random() < 0.05) sfxWaterLap();                                       // 水波拍岸
    }
  }
}

function draw(t) {
  if (inMenu) { drawCoverScene(t); return; }           // 主選單：全螢幕封面
  if (victoryActive) { drawVictoryScene(t); return; }  // 通關：全螢幕勝利場景
  if (state.currentSpot === 'underwater') {
    drawUnderwater(t);    // 海底場景專屬渲染
  } else {
    drawSky();
    drawCelestial(t);      // 星星 / 太陽 / 月亮 / 雲
    drawWaterBase();
    drawReflection(t);     // 水面動態反光
    drawHorizonHaze();     // 地平線距離霧
    drawDecor(t);
    drawTerrain();
    drawShoreDetails();    // 岸邊植物/碎石細節
    drawFireflies(t);      // 夜間螢火蟲
    drawLeaves();          // 落葉
    // 環境魚
    for (const f of ambient) { const fy = f.y + Math.sin(t * 2 + f.phase) * 0.5; drawFish(f.id, f.x, fy, f.dir, t); }
    // 泡泡
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (const b of bubbles) ctx.fillRect(b.x * S, b.y * S, b.r * S, b.r * S);
    drawWaves(t);
    drawFoamLine(t);        // 岸邊泡沫線
    drawLightRays(t);
    drawCaustics(t);        // 水底焦散光斑
    drawMotes(t);           // 光柱中的光塵
    drawRipples();          // 雨滴漣漪
    drawFisherman();
    drawRodAndLine();
    drawBobber(t);
    drawFightEffects(t);
    drawLampLight();        // 燈具照明（加法混合、逐像素）
    drawRain();             // 雨絲
    drawFog();              // 霧
    drawLightningFlash();   // 閃電白光
  }
  drawWaterParticles();     // 水體粒子（各區域）
  drawEventFx();            // 隨機事件特效
  drawVignette();           // 鏡頭暈影

  // 淡入淡出黑幕
  if (fade > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + fade + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function loop(now) {
  const t = now / 1000;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  update(dt, t);
  draw(t);
  requestAnimationFrame(loop);
}

/* ---------- 十三、初始化 ---------- */

window.addEventListener('resize', resize);
resize();
loadGame();
updateHUD();
genAmbient();
renderPanel('inv'); // 預先渲染，開啟時即有內容
closePanel();
document.body.classList.add('menu-mode');   // 開場在主選單，隱藏遊戲內 HUD/狀態列
fade = 1; fading = true; fadeDir = -1;  // 開場淡入
requestAnimationFrame(loop);
</script>
</body>
