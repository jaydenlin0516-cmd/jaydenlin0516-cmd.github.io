/* ---------- 四、畫布與繪圖設定 ---------- */

const scene = document.getElementById('scene');
let ctx = scene.getContext('2d');   // 用 let，圖鑑小畫布需要暫時切換繪圖目標
let W = 0, H = 0, S = 4, LW = 0, LH = 0, waterY = 0, landW = 0, fisherX = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  scene.width = Math.floor(W * dpr);
  scene.height = Math.floor(H * dpr);
  scene.style.width = W + 'px';
  scene.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 像素方塊大小（依視窗自適應）
  S = Math.max(2, Math.min(8, Math.round(Math.min(W, H) / 180)));   // 像素密度 ×2：方塊更小、畫面更細緻
  LW = Math.ceil(W / S);
  LH = Math.ceil(H / S);
  waterY = Math.round(LH * 0.5);                 // 水面高度
  landW = Math.max(12, Math.round(LW * 0.26));   // 左岸寬度
  fisherX = Math.max(4, landW - 7);              // 漁夫位置（更靠近水面）
  // 依新尺寸重新生成星空與雲
  stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * LW, y: Math.random() * waterY * 0.7, tw: Math.random() * 6.28 });
  clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * LW, y: 2 + Math.random() * waterY * 0.4, w: 6 + Math.random() * 9, speed: 0.7 + Math.random() * 1.4 });
}

// 在「格子座標」畫色塊（每一格 = S 螢幕像素）
function fill(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * S, y * S, w * S, h * S);
}

function line(ax, ay, bx, by, color, w) {
  ctx.strokeStyle = color;
  ctx.lineWidth = (w || 1) * Math.max(1, Math.round(S / 4));
  ctx.beginPath();
  ctx.moveTo(ax * S, ay * S);
  ctx.lineTo(bx * S, by * S);
  ctx.stroke();
}

// 像素橢圓（魚、頭等圓潤造型）
function ellipse(cx, cy, L, H, color) {
  cx = Math.round(cx); cy = Math.round(cy);
  if (H <= 0 || L <= 0) return;   // 修復：避免無效尺寸
  const halfH = Math.round(H / 2);
  const denom = (H - 1) / 2;      // 修復：H=1 時除數為 0 會產生 NaN
  for (let r = 0; r < H; r++) {
    const d = denom > 0 ? (r - denom) / denom : 0;
    const w = Math.max(1, Math.round((L / 2) * Math.sqrt(Math.max(0, 1 - d * d))));
    fill(cx - w, cy - halfH + r, w * 2, 1, color);
  }
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

/* ---------- 解析度升級（像素密度 ×2）與統一 4 階色板 ---------- */
const RES = 2;   // 前景精靈的解析度倍率：搭配 S 縮小，使像素更細緻、細節更多

// 從「固有色」產生 4 階：高光 / 亮面 / 陰影 / 高光點（體積感 + 全圖色調統一）
function ramp(hex) {
  const b = hexToRgb(hex);
  const hi   = rgbToHex(Math.min(255, b[0] + 42), Math.min(255, b[1] + 42), Math.min(255, b[2] + 42));
  const lo   = rgbToHex(Math.max(0, b[0] - 52), Math.max(0, b[1] - 52), Math.max(0, b[2] - 52));
  const spec = rgbToHex(Math.min(255, Math.round(b[0] + (255 - b[0]) * 0.5)), Math.min(255, Math.round(b[1] + (255 - b[1]) * 0.5)), Math.min(255, Math.round(b[2] + (255 - b[2]) * 0.5)));
  return { hi: hi, base: hex, lo: lo, spec: spec };
}

// 以 (cx, cy) 為中心，把尚未重繪為高解析度的精靈放大 RES 倍（避免解析度升級後尺寸縮小）
function scSprite(cx, cy, fn) {
  ctx.save();
  ctx.translate(cx * S, cy * S);
  ctx.scale(RES, RES);
  ctx.translate(-cx * S, -cy * S);
  fn();
  ctx.restore();
}

function bankTop() { return state.currentSpot === 'pier' ? waterY - 3 : waterY - 2; }
// 人物上半身錨點（呼吸起伏＋拋竿前傾/拉扯後仰），供人物與釣竿共用，讓釣竿跟隨人物擺動
function charAnchor() {
  const fy = bankTop() + boatBob();
  const t = performance.now() / 1000;
  const bob = (phase === 'idle' || phase === 'waiting') ? (Math.sin(t * 2) > 0 ? 0 : 2) : 0;
  const by = fy - bob;
  const lean = (phase === 'cast') ? 2 : (phase === 'fight' && holding) ? -2 : 0;
  return { px: fisherX + lean, by: by };
}

function getRodTip() {
  // 釣竿長度約為人身 1.5 倍（解析度 ×2 後同步放大）；竿座對齊人物握竿手部
  const a = charAnchor();
  const reach = 34;
  return { x: a.px + 6 + reach, y: Math.max(4, a.by - 16 - reach) };
}

// 目前竿尖位置：拋竿時甩竿、拉扯時彎曲（與 drawRodAndLine 一致）
function currentRodTip() {
  const tip = getRodTip();
  if (phase === 'cast') {
    // 拋竿動作：竿尖小幅甩動（控制幅度，避免竿身異常伸長）
    const sweep = Math.sin(castP * Math.PI);   // 0→1→0
    return { x: tip.x - 2 + Math.round(sweep * 2), y: tip.y + 3 - Math.round(sweep * 3) };
  }
  if (phase === 'fight' && holding) return { x: tip.x - 2, y: tip.y + 10 };   // 受力下彎
  return tip;
}

// 開放水面的左邊界（陸地/碼頭的右側）：水紋、光束、魚、泡泡都只在這個範圍內繪製，
// 這樣才能嚴格分開陸地與水域，避免水波紋疊到草地上。
function waterLeft() {
  // 碼頭（木棧道）與雲海天池（浮空平台）的「陸地」都位於水面上方，水面延伸到其下方，
  // 故水面左邊界設為 2；其餘陸地/岸壁會蓋住水面，左邊界設為 landW+2。
  if (state.currentSpot === 'pier' || state.currentSpot === 'sky') return 2;
  return landW + 2;
}

// 目前釣點的魚群池（開闊海域依船隻朝向選擇不同魚群）
function spotFishPool() {
  const spot = SPOTS[state.currentSpot];
  if (spot.dirFish && state.boatDir) return spot.dirFish[state.boatDir] || spot.fish;
  return spot.fish;
}

// 水流速度（格/秒，正=向右、負=向左）：海域平緩、海底強烈、陸上/幻想輕微
function flowSpeed() {
  const f = { river:0.3, lake:0.25, swamp:-0.2, pier:0.4, sea:0.5, underwater:2.0, sky:0.25, glow:-0.2 };
  return f[state.currentSpot] || 0;
}

// 船體起伏（開闊海域漁船隨波浪上下起伏，供船與人物同步）
function boatBob() {
  if (state.currentSpot !== 'sea') return 0;
  return (Math.sin(performance.now() / 1000 * 2.6) > 0 ? 0 : 1);
}

/* ---------- 四之二、時間 / 天氣 / 光照系統 ---------- */

// 顏色工具（十六進位 ↔ RGB、混色、明暗/冷暖調色）
function hexToRgb(h) { h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgbToHex(r,g,b) { return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mixColor(c1,c2,t) { const a=hexToRgb(c1), b=hexToRgb(c2); return rgbToHex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t); }
function shade(hex, mul, tint) { let [r,g,b]=hexToRgb(hex); r*=mul; g*=mul; b*=mul; if (tint>0) { r+=28*tint; g+=14*tint; b-=6*tint; } else if (tint<0) { b+=24*(-tint); r-=8*(-tint); g-=4*(-tint); } return rgbToHex(r,g,b); }
function smoothstep(x) { x = clamp(x,0,1); return x*x*(3-2*x); }

// 時間：0=午夜、0.25=日出、0.5=正午、0.75=黃昏，持續循環
let timeOfDay = 0.30;
let TIME_SPEED = 0.0035;     // 時間流逝速度（一整天約 4.8 分鐘，開發者模式可調）

// 天氣：三個連續參數（cloud 陰天、rain 小雨、fog 霧），會平滑過渡
let weather = { cloud: 0, rain: 0, fog: 0 };
let weatherTarget = { cloud: 0, rain: 0, fog: 0 };
let weatherTimer = 20;
const WEATHER_PRESETS = [
  { cloud:0.0, rain:0.0, fog:0.0 },   // 晴天
  { cloud:0.8, rain:0.0, fog:0.0 },   // 陰天
  { cloud:0.7, rain:0.7, fog:0.1 },   // 小雨
  { cloud:0.5, rain:0.0, fog:0.8 },   // 霧天
];

// 一天中各時間點的配色關鍵幀（首尾銜接循環，避免跳變）
const TIME_KEYFRAMES = [
  { t:0.00, skyTop:'#0a1233', skyHor:'#203158', waterTop:'#1a2a46', waterBot:'#0a1426' }, // 午夜（藍黑）
  { t:0.25, skyTop:'#2c4a6a', skyHor:'#ff8a4a', waterTop:'#3a5a7a', waterBot:'#1c2a40' }, // 清晨
  { t:0.50, skyTop:'#5db8ee', skyHor:'#cfe8f8', waterTop:'#3f8fc4', waterBot:'#25608a' }, // 正午
  { t:0.75, skyTop:'#2a3a5c', skyHor:'#ffb060', waterTop:'#4a5a80', waterBot:'#1c2a3c' }, // 黃昏
  { t:1.00, skyTop:'#0a1233', skyHor:'#203158', waterTop:'#1a2a46', waterBot:'#0a1426' }, // 午夜（藍黑）
];
function getTimePalette(t) {
  const n = TIME_KEYFRAMES.length - 1;
  const x = t * n;
  const i = Math.min(Math.floor(x), n - 1);
  const f = smoothstep(x - i);
  const a = TIME_KEYFRAMES[i], b = TIME_KEYFRAMES[i + 1];
  return { skyTop: mixColor(a.skyTop,b.skyTop,f), skyHor: mixColor(a.skyHor,b.skyHor,f), waterTop: mixColor(a.waterTop,b.waterTop,f), waterBot: mixColor(a.waterBot,b.waterBot,f) };
}

// 每幀由「時間 + 天氣」計算出的統一光照參數（所有物體共用同一套）
const lighting = {
  sunElev:0, sunHoriz:0, daylight:1, ambient:1, warm:0, cool:0,
  skyTop:'#5db8ee', skyHorizon:'#cfe8f8', waterTop:'#3f8fc4', waterBot:'#25608a',
  sunX:0, sunY:0, moonX:0, moonY:0, moonElev:0, cloud:0, rain:0, fog:0, shadowDir:1, shadowLen:2,
};

function computeLighting() {
  // 海底場景：固定水底環境，不隨晝夜/天氣變化（保留 ambient/cool 供逐像素照明使用）
  if (state.currentSpot === 'underwater') {
    lighting.sunElev = -1; lighting.moonElev = -1;
    lighting.daylight = 0; lighting.warm = 0; lighting.cool = 0.6;
    lighting.cloud = 0; lighting.rain = 0; lighting.fog = 0.15;
    lighting.ambient = 0.55;
    lighting.skyTop = '#0a2233'; lighting.skyHorizon = '#16445e';
    lighting.waterTop = '#0e3a50'; lighting.waterBot = '#041a28';
    lighting.shadowDir = 1; lighting.shadowLen = 1.5;
    return;
  }
  const a = (timeOfDay - 0.25) * Math.PI * 2;
  const sunElev = Math.sin(a), sunHoriz = Math.cos(a);
  const pal = getTimePalette(timeOfDay);
  const daylight = smoothstep(clamp(sunElev, 0, 1));

  lighting.sunElev = sunElev;
  lighting.sunHoriz = sunHoriz;
  lighting.daylight = daylight;
  lighting.warm = clamp(1 - Math.abs(sunElev) * 3, 0, 1);   // 日出日落暖橙
  lighting.cool = clamp(-sunElev, 0, 1);                    // 夜晚冷藍
  lighting.cloud = weather.cloud; lighting.rain = weather.rain; lighting.fog = weather.fog;

  // 環境亮度：白天亮、夜晚保留月光（最低 0.30），陰天/下雨略降
  let ambient = 0.30 + 0.70 * daylight;
  ambient *= (1 - weather.cloud * 0.25) * (1 - weather.rain * 0.15);
  lighting.ambient = ambient;

  // 天空：時間配色 + 陰天混灰 + 霧天低飽和
  let skyTop = pal.skyTop, skyHor = pal.skyHor;
  skyTop = mixColor(skyTop, '#7a8494', weather.cloud * 0.5);
  skyHor = mixColor(skyHor, '#aab4c4', weather.cloud * 0.6);
  skyTop = mixColor(skyTop, '#c0c8d0', weather.fog * 0.7);
  skyHor = mixColor(skyHor, '#d0d8e0', weather.fog * 0.7);
  lighting.skyTop = skyTop; lighting.skyHorizon = skyHor;

  // 水面：時間配色 + 天氣影響
  let wTop = pal.waterTop, wBot = pal.waterBot;
  wTop = mixColor(wTop, '#5a6a7a', weather.cloud * 0.4 + weather.rain * 0.35);
  wBot = mixColor(wBot, '#2a3a48', weather.cloud * 0.3 + weather.rain * 0.3);
  wTop = mixColor(wTop, '#9aa8b4', weather.fog * 0.5);
  lighting.waterTop = wTop; lighting.waterBot = wBot;

  // 太陽 / 月亮位置
  lighting.sunX = LW / 2 - sunHoriz * LW * 0.35;
  lighting.sunY = waterY - Math.max(0, sunElev) * (waterY - 4);
  lighting.moonElev = -sunElev;
  lighting.moonX = LW / 2 + sunHoriz * LW * 0.35;
  lighting.moonY = waterY - Math.max(0, -sunElev) * (waterY - 4);

  // 陰影方向背向太陽；太陽越低影子越長
  lighting.shadowDir = sunHoriz >= 0 ? 1 : -1;
  lighting.shadowLen = 1.5 + (1 - daylight) * 3;
}

function updateWeather(dt) {
  weatherTimer -= dt;
  if (weatherTimer <= 0) { weatherTimer = 35 + Math.random() * 25; weatherTarget = WEATHER_PRESETS[Math.floor(Math.random() * 4)]; }
  const k = 1 - Math.exp(-dt * 0.4);   // 平滑逼近目標天氣
  weather.cloud += (weatherTarget.cloud - weather.cloud) * k;
  weather.rain += (weatherTarget.rain - weather.rain) * k;
  weather.fog += (weatherTarget.fog - weather.fog) * k;
}

// 星空 / 雲 / 雨滴 / 漣漪（resize 時會重建星空與雲）
let stars = [], clouds = [], raindrops = [], ripples = [];

// 環境粒子：光塵 / 螢火蟲 / 落葉 / 閃電白光
let motes = [], fireflies = [], leaves = [];
let flash = 0;          // 閃電白光（打雷時觸發，逐漸衰減）
let caughtStart = 0;    // 釣到魚的時刻（供躍出動畫）

// 陰影（角色、樹木共用，方向與長度由光照決定）
function drawShadow(cx, gy, w) {
  const off = lighting.shadowDir * lighting.shadowLen * 0.7;
  ctx.globalAlpha = 0.10 + 0.22 * lighting.daylight;
  ellipse(Math.round(cx + off), gy + 1, w, Math.max(1, Math.round(w / 2.5)), '#060810');
  ctx.globalAlpha = 1;
}

/* ---------- 五、場景繪圖 ---------- */

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, waterY * S);
  g.addColorStop(0, lighting.skyTop);
  g.addColorStop(1, lighting.skyHorizon);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, waterY * S);
}

// 天空中的天體與雲（星星、太陽、月亮、雲）
function drawCelestial(t) {
  // 星星（夜晚明顯，霧天/陰天減弱，會閃爍）
  const starA = clamp(lighting.cool * 0.9 - lighting.fog * 0.5, 0, 1) * (1 - weather.cloud * 0.6);
  if (starA > 0.02) {
    for (const s of stars) {
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.tw));
      ctx.fillStyle = 'rgba(255,255,255,' + (starA * tw) + ')';
      ctx.fillRect(Math.round(s.x) * S, Math.round(s.y) * S, S, S);
    }
  }
  // 太陽（白晝）
  if (lighting.sunElev > -0.03) {
    const sunCol = mixColor('#fff0a0', '#ff8a30', lighting.warm);
    drawSun(lighting.sunX, lighting.sunY, sunCol);
  }
  // 月亮（夜晚）
  if (lighting.moonElev > 0.03) drawMoon(lighting.moonX, lighting.moonY);
  // 銀河（夜晚，斜向星帶）
  drawMilkyWay(t);
  // 雲
  drawClouds(t);
}

function drawSun(x, y, col) {
  const r = Math.round(2 + (1 - lighting.sunElev) * 2);   // 越接近地平線越大
  ctx.globalAlpha = 0.22;
  ellipse(x, y, r * 2 + 8, r * 2 + 8, col);   // 光暈
  ctx.globalAlpha = 1;
  ellipse(x, y, r * 2 + 3, r * 2 + 3, col);
  ellipse(x, y, r * 2, r * 2, '#fff8d0');
}

function drawMoon(x, y) {
  // 月亮光暈（柔和外圈）
  const halo = ctx.createRadialGradient(x * S, y * S, 3 * S, x * S, y * S, 15 * S);
  halo.addColorStop(0, 'rgba(215,228,250,0.35)');
  halo.addColorStop(1, 'rgba(215,228,250,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(x * S - 15 * S, y * S - 15 * S, 30 * S, 30 * S);
  // 月面
  ellipse(x, y, 7, 7, '#e8ecf4');
  ellipse(x + 1, y, 5, 5, '#c9d4e4');   // 月面陰影
  ellipse(x - 1, y - 1, 2, 2, '#aab6c8');
  ellipse(x, y + 2, 1, 1, '#aab6c8');
}

// 銀河帶（夜晚，斜向暗淡星帶 + 亮星）
function drawMilkyWay(t) {
  const a = clamp(lighting.cool * 0.4 - lighting.fog * 0.3, 0, 1) * (1 - weather.cloud * 0.5);
  if (a <= 0.02) return;
  const g = ctx.createLinearGradient(0, waterY * S * 0.7, LW * S, 0);
  g.addColorStop(0, 'rgba(170,190,230,0)');
  g.addColorStop(0.5, 'rgba(195,208,242,' + (a * 0.5).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(170,190,230,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, waterY * S);
  ctx.fillStyle = 'rgba(232,240,255,' + (a * 0.7).toFixed(3) + ')';
  for (let i = 0; i < 30; i++) {
    const d = ((i * 0.13) + 0.05) % 1;
    const x = d * LW + Math.sin(i * 2.4) * 2;
    const y = (1 - d) * waterY * 0.85 + Math.cos(i * 1.7) * 1.5;
    if (Math.sin(t * 1.3 + i) > 0) ctx.fillRect(Math.round(x) * S, Math.round(y) * S, S, S);
  }
}

function drawClouds(t) {
  const col = mixColor('#ffffff', '#8a93a8', weather.cloud);
  ctx.fillStyle = shade(col, 0.5 + 0.5 * lighting.ambient, 0);
  for (const c of clouds) {
    const x = ((c.x + t * c.speed) % (LW + 16)) - 8;
    ctx.fillRect(x * S, c.y * S, c.w * S, 2 * S);
    ctx.fillRect((x + 1) * S, (c.y - 1) * S, (c.w - 2) * S, 1 * S);
  }
}

// 水體（漸層）：顏色由光照系統即時計算（隨時間/天氣變化）
function drawWaterBase() {
  const g = ctx.createLinearGradient(0, waterY * S, 0, H);
  g.addColorStop(0, lighting.waterTop);
  g.addColorStop(1, lighting.waterBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, waterY * S, W, H - waterY * S);
}

// 水面動態反光：天空倒影 + 岸邊倒影 + 太陽/月亮高光 + 夜晚星光
function drawReflection(t) {
  const wl = waterLeft();
  // 天空倒影：貼近地平線的一條亮帶
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = lighting.skyHorizon;
  ctx.fillRect(wl * S, waterY * S, (LW - wl) * S, 2 * S);
  ctx.globalAlpha = 1;
  // 岸邊景物倒影（左岸的深色鏡像，畫在水域內、岸的右側，邊緣被波紋打散）
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = shade(SPOTS[state.currentSpot].land, 0.5 * lighting.ambient, lighting.warm - lighting.cool);
  const rx = waterLeft();   // 修復：倒影應畫在水域（岸的右側），原先畫在岸下會被地形蓋住
  for (let i = 1; i <= 5; i++) {
    const w = Math.round(landW * 0.7) + Math.round(Math.sin(t * 2.5 + i * 1.2) * 3);   // 動態扭曲
    ctx.fillRect(rx * S, (waterY + i) * S, Math.max(0, w) * S, S);
    ctx.fillRect((rx + w + 1) * S, (waterY + i) * S, S, S);   // 邊緣碎塊
  }
  ctx.globalAlpha = 1;
  // 太陽 / 月亮高光：沿水面垂直的閃爍亮點，位置跟隨天體、亮度跟隨高度
  if (lighting.sunElev > 0.03) drawGlint(lighting.sunX, '#fff0a0', lighting.daylight, t);   // 太陽只在白天
  if (lighting.moonElev > 0.05) drawGlint(lighting.moonX, '#a0b8e0', lighting.moonElev * 0.2, t);   // 月光較暗、偏冷色
  // 夜晚星光在水面的點點反光
  if (lighting.cool > 0.3 && weather.fog < 0.5) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 12; i++) {
      const x = wl + ((i * 7919 + 37) % Math.max(1, LW - wl));
      const y = waterY + 1 + ((i * 104729 + 13) % Math.max(1, LH - waterY - 2));
      if (Math.sin(t * 2 + i) > -0.2) ctx.fillRect(Math.round(x) * S, Math.round(y) * S, S, S);
    }
  }
}

// 水面高光：被波紋打散的垂直亮帶
function drawGlint(x, color, strength, t) {
  if (strength <= 0.02) return;
  const cx = Math.round(x);
  const rows = Math.round(LH * 0.12);
  const wl = waterLeft();
  for (let i = 0; i < rows; i++) {
    const y = waterY + 1 + i;
    const spread = Math.round((1 + i * 0.6) * strength * 2.2);
    const dx = Math.round(Math.sin(i * 1.1 + t * 3) * spread);
    const w = Math.max(1, Math.round(strength * 5) - Math.floor(i / 3));
    const a = strength * (0.6 - (i / rows) * 0.5) * (0.7 + 0.3 * Math.sin(i * 0.8 + t * 2.5));
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = color;
    // 修復：把高光裁切在水域範圍內，避免太陽在陸地方向時高光畫到草地上
    const gx = Math.max(wl, cx + dx - Math.floor(w / 2));
    if (gx >= LW) continue;
    const gw = Math.max(1, Math.min(w, LW - gx));
    ctx.fillRect(gx * S, y * S, gw * S, S);
  }
  ctx.globalAlpha = 1;
}

// 水面波紋（只在開放水域）；下雨時波紋更密
function drawWaves(t) {
  const wl = waterLeft();
  const flow = flowSpeed();
  const waveA = (0.14 + weather.rain * 0.07) * (0.4 + 0.6 * lighting.daylight);
  ctx.fillStyle = 'rgba(255,255,255,' + waveA + ')';
  const rows = weather.rain > 0.3 ? 5 : 4;
  const dir = flow >= 0 ? 1 : -1;
  for (let row = 0; row < rows; row++) {
    const y = waterY + 1 + row * 3;
    // 波浪紋理隨水流方向連續移動
    const shift = ((Math.floor(t * (3 + row * 2) * dir) % 6) + 6) % 6;
    for (let x = wl - 6 + shift; x < LW; x += 6) {
      if (x < wl) continue;
      ctx.fillRect(x * S, y * S, 3 * S, S);
      if (row % 2 === 0) ctx.fillRect((x + 3) * S, (y + 2) * S, 2 * S, S);   // 錯落細波
    }
  }
  // 近岸細浪（更密的碎波）
  ctx.globalAlpha = waveA * 0.5;
  for (let i = 0; i < 10; i++) {
    const x = wl + ((i * 5 + Math.floor(t * 5 * dir)) % Math.max(1, LW - wl));
    ctx.fillRect(Math.max(wl, x) * S, (waterY + 1 + (i % 4)) * S, 2 * S, S);
  }
  ctx.globalAlpha = 1;
}

// 水面下的光束（只在晴朗白晝）
function drawLightRays(t) {
  if (lighting.daylight < 0.4 || weather.cloud > 0.4) return;
  const wl = waterLeft();
  ctx.save();
  ctx.globalAlpha = (lighting.daylight - 0.4) * 0.18;
  ctx.fillStyle = '#fff6d0';
  for (let i = 0; i < 4; i++) {
    const base = wl + (LW - wl) * (0.12 + i * 0.24);
    const x = base + Math.sin(t * 0.6 + i * 1.3) * 3;
    ctx.fillRect(x * S, waterY * S, 3 * S, (LH - waterY) * S);
  }
  ctx.restore();
}

// 水底焦散光斑（移動的亮紋）
function drawCaustics(t) {
  if (lighting.daylight < 0.5 || weather.cloud > 0.3) return;
  const wl = waterLeft();
  ctx.save();
  ctx.globalAlpha = (lighting.daylight - 0.5) * 0.12;
  ctx.fillStyle = '#fff6c8';
  for (let i = 0; i < 6; i++) {
    const x = wl + ((i * 37 + Math.floor(t * 4)) % Math.max(1, LW - wl));
    const y = waterY + 8 + ((i * 53 + Math.floor(t * 3)) % Math.max(1, LH - waterY - 10));
    const w = 3 + (i % 3);
    ctx.fillRect(x * S, y * S, w * S, S);
    ctx.fillRect((x + 1) * S, (y + 1) * S, (w - 1) * S, S);
  }
  ctx.restore();
}

// 岸邊泡沫線（水陸交界處的白色泡沫，隨波浪起伏）
function drawFoamLine(t) {
  const wl = waterLeft();
  const a = (0.35 + 0.35 * lighting.daylight) * (1 - weather.fog * 0.5);
  if (a <= 0.02) return;
  for (let i = 0; i < 9; i++) {
    const y = waterY + i;
    const wob = Math.round(Math.sin(t * 3 + i * 1.1) * 2);
    const x = wl + wob;
    if (x < wl - 1) continue;
    ctx.fillStyle = 'rgba(255,255,255,' + (a * (0.6 + 0.4 * Math.sin(t * 2 + i))).toFixed(3) + ')';
    ctx.fillRect(x * S, y * S, (1 + (i % 2)) * S, S);
  }
}

// 地平線距離霧（近地平線的淡霧，增加縱深）
function drawHorizonHaze() {
  if (weather.fog > 0.5) return;
  const g = ctx.createLinearGradient(0, waterY * S - 22 * S, 0, waterY * S + 12 * S);
  g.addColorStop(0, 'rgba(210,222,235,0)');
  g.addColorStop(0.5, 'rgba(210,222,235,' + (0.12 * lighting.daylight).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(210,222,235,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, waterY * S - 22 * S, W, 34 * S);
}

// 鏡頭暈影（四角漸暗，增加電影感）
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// 雨絲（下雨時）
function drawRain() {
  if (weather.rain < 0.05) return;
  ctx.fillStyle = 'rgba(190,210,235,' + (0.32 * weather.rain) + ')';
  for (const d of raindrops) ctx.fillRect(Math.round(d.x) * S, Math.round(d.y) * S, S, Math.round(d.len) * S);
}

// 雨滴落在水面的漣漪（像素圈，會擴散淡出）
function drawRipples() {
  for (const r of ripples) {
    const rr = Math.round(r.r);
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, r.alpha) + ')';
    const pts = [[1,0],[-1,0],[0,1],[0,-1],[0.7,0.7],[0.7,-0.7],[-0.7,0.7],[-0.7,-0.7]];
    for (const [dx,dy] of pts) ctx.fillRect(Math.round(r.x + dx * rr) * S, Math.round(r.y + dy * rr) * S, S, S);
  }
}

// 霧：罩住遠景與水面，降低整體對比
function drawFog() {
  if (weather.fog < 0.03) return;
  const a = weather.fog;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(198,208,218,' + (a * 0.55) + ')');
  g.addColorStop(0.45, 'rgba(210,218,226,' + (a * 0.3) + ')');
  g.addColorStop(1, 'rgba(216,224,230,' + (a * 0.08) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// 海底漩渦視覺特效（旋轉螺旋）
function drawVortex(t) {
  const cx = Math.round(LW * 0.62), cy = Math.round(LH * 0.38);
  const rot = t * 2.2;
  ctx.fillStyle = 'rgba(190,230,250,0.45)';
  for (let i = 0; i < 24; i++) {
    const ang = rot + i * 0.55;
    const r = 1 + i * 0.9;
    const x = cx + Math.round(Math.cos(ang) * r);
    const y = cy + Math.round(Math.sin(ang) * r);
    if (i % 2 === 0) ctx.fillRect(x * S, y * S, S, S);
  }
  ellipse(cx, cy, 5, 5, '#0a1e30');
}

// 海底場景（無晝夜/天氣，固定水底環境；仍用逐像素照明）
function drawUnderwater(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e3a50');
  g.addColorStop(0.6, '#082a3c');
  g.addColorStop(1, '#041a28');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 海底岩石地（2× 較大岩石，含亮/暗面）
  const seabed = Math.round(LH * 0.82);
  fill(0, seabed, LW, LH - seabed, '#1a3a48');
  fill(0, seabed, LW, 2, '#2a4a58');
  for (let i = 0; i < 6; i++) {
    const rx = 2 + Math.floor(seededRand(i * 7 + 11) * (LW - 6));
    const rw = 5 + Math.floor(seededRand(i * 13 + 17) * 6);
    fill(rx, seabed - 3, rw, 3, '#2a4a58');
    fill(rx + 1, seabed - 3, rw - 2, 1, '#3a5a6a');
    fill(rx + rw - 1, seabed - 3, 1, 3, '#1a2a38');
  }
  // 海草（2×，隨水流擺動）
  for (let i = 0; i < 8; i++) {
    const kx = 2 + Math.floor(seededRand(i * 17 + 5) * (LW - 4));
    const kh = 6 + Math.floor(seededRand(i * 11 + 9) * 8);
    const sway = Math.round(Math.sin(t * 2 + i * 1.4) * 2);
    fill(kx, seabed - kh, 2, kh, shade('#2a7a4a', lighting.ambient, 0));
    fill(kx + sway, seabed - kh, 2, 2, shade('#4aaa6a', lighting.ambient, 0));   // 葉尖隨流
  }
  // 彩色珊瑚叢（2×）
  const corals = ['#e8788a', '#e8a878', '#a878e8'];
  for (let i = 0; i < 7; i++) {
    const cx2 = 3 + Math.floor(seededRand(i * 19 + 13) * (LW - 6));
    const ch = 3 + Math.floor(seededRand(i * 29 + 7) * 4);
    for (let j = 0; j < ch; j++) fill(cx2 + (j % 2) * 2, seabed - 2 - j * 2, 2, 2, shade(corals[i % 3], lighting.ambient, 0));
  }
  // 貝殼（2×）
  for (let i = 0; i < 5; i++) {
    const sx = 3 + Math.floor(seededRand(i * 23 + 3) * (LW - 6));
    fill(sx, seabed - 2, 2, 2, shade('#f0e0c8', lighting.ambient, 0));
    fill(sx - 2, seabed - 2, 2, 2, shade('#d8c8b0', lighting.ambient, 0));
    fill(sx, seabed - 3, 2, 1, shade('#fff8e8', lighting.ambient, 0));
  }
  // 沉船殘骸（2×）
  fill(Math.round(LW * 0.18), seabed - 8, 16, 6, shade('#3a2a20', lighting.ambient, 0));
  fill(Math.round(LW * 0.18) + 2, seabed - 13, 3, 6, shade('#4a3a2a', lighting.ambient, 0));
  fill(Math.round(LW * 0.18) + 1, seabed - 5, 14, 2, shade('#2a1e16', lighting.ambient, 0));
  fill(Math.round(LW * 0.18) + 4, seabed - 9, 4, 1, shade('#5a4a38', lighting.ambient, 0));
  // 海草森林（較高、較密，2×，隨水流擺動）
  for (let i = 0; i < 10; i++) {
    const kx = Math.round(LW * 0.45) + i * 4;
    const kh = 10 + Math.floor(seededRand(i * 31 + 11) * 12);
    const sway = Math.round(Math.sin(t * 2.2 + i * 1.1) * 3);
    fill(kx, seabed - kh, 2, kh, shade('#1e6a3a', lighting.ambient, 0));
    fill(kx + sway, seabed - kh, 2, 2, shade('#3a9a5a', lighting.ambient, 0));   // 葉尖隨流
  }
  // 漩渦
  drawVortex(t);
  // 環境魚（大量自由游動）
  for (const f of ambient) { const fy = f.y + Math.sin(t * 2 + f.phase) * 0.5; drawFish(f.id, f.x, fy, f.dir, t); }
  // 海底陰影（替代氣泡，增加深海壓迫感）
  ctx.fillStyle = 'rgba(2,10,18,0.25)';
  ctx.fillRect(0, seabed * S, W, (LH - seabed) * S);
  // 漁夫（潛水裝備）+ 釣竿 + 浮標
  drawFisherman();
  drawRodAndLine();
  drawBobber(t);
  drawFightEffects(t);
  drawLampLight();
}

// 背景裝飾（依釣點不同，顏色統一接受光照/天氣影響）
function drawDecor(t) {
  const type = SPOTS[state.currentSpot].type;
  const tint = lighting.warm - lighting.cool;
  if (type === 'lake') {
    // 遠山（兩層色 + 山頂雪）
    fill(landW + 8, waterY - 8, 16, 8, shade('#7a8a9a', lighting.ambient, tint));
    fill(landW + 14, waterY - 12, 12, 12, shade('#8a9aaa', lighting.ambient, tint));
    fill(landW + 30, waterY - 6, 12, 6, shade('#7a8a9a', lighting.ambient, tint));
    fill(landW + 10, waterY - 9, 4, 2, shade('#e8eef2', lighting.ambient, tint)); // 山頂雪
  } else if (type === 'swamp') {
    drawDeadTree(landW + 12, waterY - 1);
    drawDeadTree(LW - 10, waterY - 1);
  } else if (type === 'pier') {
    // 燈塔 + 遠方帆船
    fill(LW - 14, waterY - 12, 6, 12, shade('#d8d0c0', lighting.ambient, tint));
    fill(LW - 15, waterY - 13, 8, 2, shade('#e83838', lighting.ambient, tint));
    fill(LW - 13, waterY - 13, 2, 1, '#fff2b0');
    fill(landW + 20, waterY - 4, 6, 3, shade('#f0e8d8', lighting.ambient, tint)); // 帆船
    fill(landW + 22, waterY - 7, 1, 3, shade('#f0e8d8', lighting.ambient, tint));
  } else if (type === 'sea') {
    // 開闊海域：遠方小島 + 帆船 + 海鳥
    fill(landW + 12, waterY - 5, 10, 5, shade('#8a9a6a', lighting.ambient, tint));
    fill(landW + 14, waterY - 7, 6, 2, shade('#6a8a4a', lighting.ambient, tint));
    fill(LW - 16, waterY - 4, 7, 4, shade('#d8e0e8', lighting.ambient, tint));
    fill(LW - 13, waterY - 8, 1, 4, shade('#d8e0e8', lighting.ambient, tint));
    for (let i = 0; i < 3; i++) {
      const bx = Math.round(LW * 0.3 + i * 9 + Math.sin(t * 2 + i) * 3);
      const by = waterY - 12 - i * 2;
      fill(bx, by, 2, 1, shade('#3a3a4a', lighting.ambient, tint));
      fill(bx - 1, by + 1, 1, 1, shade('#3a3a4a', lighting.ambient, tint));
      fill(bx + 2, by + 1, 1, 1, shade('#3a3a4a', lighting.ambient, tint));
    }
    // 遠處船影
    fill(LW - 26, waterY - 5, 5, 3, shade('#5a6a7a', lighting.ambient, tint));
    fill(LW - 23, waterY - 8, 1, 3, shade('#5a6a7a', lighting.ambient, tint));
    // 漂浮雜物（木板/木箱）
    fill(Math.round(LW * 0.4), waterY, 2, 1, shade('#7a5a2a', lighting.ambient, tint));
    fill(Math.round(LW * 0.72), waterY, 1, 1, shade('#6a4a2a', lighting.ambient, tint));
    // 浪花泡沫（近景，隨波浪起伏）
    for (let i = 0; i < 4; i++) {
      const fx3 = 3 + i * 5 + Math.round(Math.sin(t * 2 + i));
      fill(fx3, waterY, 2, 1, 'rgba(255,255,255,0.35)');
    }
  } else if (type === 'fantasy') {
    if (state.currentSpot === 'sky') {
      // 雲海天池：浮空小島 + 彩虹
      fill(landW + 10, waterY - 9, 10, 5, shade('#8a9ab8', lighting.ambient, tint));
      fill(landW + 12, waterY - 12, 6, 3, shade('#6a7a98', lighting.ambient, tint));
      fill(landW + 11, waterY - 10, 1, 2, shade('#5a6a88', lighting.ambient, tint));
      const rc = ['#ff6a6a', '#ffc060', '#6aff6a', '#6ac0ff'];
      ctx.globalAlpha = 0.5;
      for (let i = 0; i < 4; i++) fill(Math.round(LW * 0.55) + i, waterY - 13 - i, 9, 1, rc[i]);
      ctx.globalAlpha = 1;
      // 浮空碎石
      for (let i = 0; i < 4; i++) {
        const rx = Math.round(LW * 0.6) + i * 6;
        const ry = waterY - 6 - (i % 2) * 3;
        fill(rx, ry, 2, 1, shade('#6a7a98', lighting.ambient, tint));
        fill(rx + 1, ry - 1, 1, 1, shade('#8a9ab8', lighting.ambient, tint));
      }
    } else {
      // 螢光湖：螢光蘑菇、螢光花、螢火蟲、發光水晶、螢光樹、水面螢光倒影
      for (let i = 0; i < 8; i++) {
        const mx = landW + 2 + i * 4;
        fill(mx, waterY - 3, 1, 3, shade('#5a7a5a', lighting.ambient, tint));
        fill(mx - 1, waterY - 4, 3, 1, shade('#7ae8a0', lighting.ambient, tint));   // 螢光菇蓋
      }
      // 螢光花（青綠/黃綠/藍紫）
      for (let i = 0; i < 7; i++) {
        const fx3 = landW + 3 + i * 3;
        fill(fx3, waterY - 2, 1, 2, shade('#4a8a5a', lighting.ambient, tint));
        fill(fx3, waterY - 3, 1, 1, ['#7ae8c8', '#c8ff70', '#7ac0ff'][i % 3]);
      }
      // 螢火蟲（更多）
      for (let i = 0; i < 10; i++) {
        const fx2 = Math.round(LW * 0.3 + i * 6 + Math.sin(t * 1.5 + i * 2) * 3);
        const fy2 = waterY - 5 - (i % 4) * 3;
        fill(fx2, fy2, 1, 1, '#c8ff70');
      }
      // 發光水晶
      for (let i = 0; i < 5; i++) {
        const cx2 = landW + 4 + i * 3;
        fill(cx2, waterY - 4, 1, 4, shade('#7ae8c8', lighting.ambient, tint));
        fill(cx2, waterY - 5, 1, 1, shade('#d0fff0', lighting.ambient, tint));
      }
      // 螢光樹（發光樹冠）
      fill(landW - 2, waterY - 8, 2, 7, shade('#3a5a3a', lighting.ambient, tint));
      fill(landW - 5, waterY - 9, 8, 3, shade('#4a9a6a', lighting.ambient, tint));
      fill(landW - 4, waterY - 10, 6, 1, shade('#7ae8a0', lighting.ambient, tint));
      // 水面螢光倒影
      ctx.globalAlpha = 0.15;
      for (let i = 0; i < 5; i++) fill(landW + 3 + i * 4, waterY + 1, 2, 1, '#7ae8a0');
      ctx.globalAlpha = 1;
    }
  } else {
    // 小河：岸邊蘆葦
    drawReeds(landW + 4, waterY - 1);
    drawReeds(LW - 6, waterY - 1);
  }
  // 河流/湖泊都有樹（含陰影）
  if (type === 'land' || type === 'lake') {
    drawTree(3, waterY - 10);
    drawTree(landW - 3, waterY - 8);
    // 斷木
    fill(landW - 10, waterY - 1, 6, 1, shade('#7a5a2a', lighting.ambient, tint));
    fill(landW - 11, waterY - 1, 1, 1, shade('#a8743c', lighting.ambient, tint));
  }
}

function drawTree(gx, gy) {
  const tint = lighting.warm - lighting.cool;
  drawShadow(gx, gy + 1, 12);
  fill(gx, gy - 16, 4, 16, shade('#7a4a2a', lighting.ambient, tint));      // 樹幹
  fill(gx + 3, gy - 16, 1, 16, shade('#5a3a1e', lighting.ambient, tint));  // 樹幹暗面
  fill(gx - 4, gy - 20, 12, 8, shade('#3e8a4a', lighting.ambient, tint));  // 樹冠暗層
  fill(gx - 3, gy - 22, 10, 3, shade('#5cb06a', lighting.ambient, tint));  // 樹冠中層
  fill(gx - 2, gy - 23, 8, 1, shade('#6fd08a', lighting.ambient, tint));   // 樹冠亮層
  fill(gx + 1, gy - 20, 2, 2, shade('#2f7a3a', lighting.ambient, tint));   // 樹冠陰影層
}

function drawDeadTree(gx, gy) {
  const c = shade('#5a4a3a', lighting.ambient, lighting.warm - lighting.cool);
  const cHi = shade('#6a5a48', lighting.ambient, lighting.warm - lighting.cool);
  const cLo = shade('#3a2e22', lighting.ambient, lighting.warm - lighting.cool);
  fill(gx, gy - 12, 4, 12, c);          // 主幹
  fill(gx + 3, gy - 12, 1, 12, cLo);    // 主幹暗面
  fill(gx - 4, gy - 12, 4, 4, c);       // 左枝
  fill(gx - 4, gy - 12, 4, 1, cHi);
  fill(gx + 4, gy - 10, 4, 4, c);       // 右枝
  fill(gx + 4, gy - 10, 4, 1, cHi);
}

function drawReeds(gx, gy) {
  const t = performance.now() / 1000;
  const tint = lighting.warm - lighting.cool;
  const c1 = shade('#4c7a3a', lighting.ambient, tint);
  const c2 = shade('#8a6a30', lighting.ambient, tint);
  for (let i = 0; i < 4; i++) {
    const sway = Math.round(Math.sin(t * 2 + i * 1.3) * (1 + weather.cloud));   // 蘆穗隨風擺動
    fill(gx + i * 3, gy - 10, 2, 10, c1);
    fill(gx + i * 3 + sway, gy - 12, 2, 2, c2);   // 蘆穗隨風擺動
  }
}

// 岸邊細節：野花、草叢、灌木、苔蘚、落葉、碎石（固定種子亂數，位置穩定不抖動）
function seededRand(n) { const x = Math.sin(n) * 10000; return x - Math.floor(x); }

function drawShoreDetails() {
  const spot = SPOTS[state.currentSpot];
  // 陸岸與螢光湖長植物；浮空平台/碼頭/海域/海底不長
  if (spot.type !== 'land' && spot.type !== 'lake' && spot.type !== 'swamp' && state.currentSpot !== 'glow') return;
  const t = performance.now() / 1000;
  const tint = lighting.warm - lighting.cool;
  const am = lighting.ambient;
  const gy = bankTop();
  for (let i = 0; i < 30; i++) {
    const r1 = seededRand(i * 7 + 1);
    const r2 = seededRand(i * 13 + 5);
    const x = 2 + Math.floor(r1 * (landW - 4));
    const wind = 1 + weather.cloud * 0.7 + weather.rain * 0.4;   // 風力隨天氣
    const sway = Math.round(Math.sin(t * 1.6 + x) * wind);       // 草木隨風微晃
    switch (i % 7) {
      case 0: { // 高草叢（高低不同，草尖隨風）
        const h = 4 + Math.floor(r2 * 4);
        fill(x, gy - h, 2, h, shade('#4c8a3a', am, tint));
        fill(x + 2, gy - h + 2, 1, h - 2, shade('#5cb06a', am, tint));
        fill(x + sway, gy - h - 1, 1, 1, shade('#6fd08a', am, tint));
        break;
      }
      case 1: // 矮草叢
        fill(x, gy - 2, 2, 2, shade('#6fae5a', am, tint));
        fill(x - 2, gy - 1, 2, 1, shade('#7ad08a', am, tint));
        break;
      case 2: { // 野花（黃/白/紅/紫，含花心）
        const cols = ['#ffe066', '#ffffff', '#ff8a8a', '#d0a0ff'];
        const col = cols[Math.floor(r2 * 4)];
        fill(x, gy - 2, 2, 2, shade(col, am, tint));
        fill(x + 1, gy - 2, 1, 1, shade('#ffffff', am + 0.15, tint));   // 花心
        fill(x, gy - 4, 1, 2, shade('#5cb06a', am, tint));   // 花莖
        break;
      }
      case 3: // 小灌木（較大，亮/暗兩層）
        fill(x - 2, gy - 4, 6, 4, shade('#3e8a4a', am, tint));
        fill(x - 1, gy - 5, 4, 1, shade('#5cb06a', am, tint));
        break;
      case 4: { // 落葉
        const cols = ['#c07830', '#a05820', '#d09040'];
        fill(x, gy, 2, 1, shade(cols[Math.floor(r2 * 3)], am, tint));
        break;
      }
      case 5: { // 石塊（較大，含亮面/陰影/高光點）
        const w = 4 + Math.floor(r2 * 3);
        fill(x, gy - 2, w, 2, shade('#8a8a94', am, tint));
        fill(x, gy - 2, w, 1, shade('#a0a0aa', am, tint));
        fill(x + w - 1, gy - 2, 1, 2, shade('#6a6a74', am, tint));
        fill(x + 1, gy - 1, 1, 1, shade('#b0b0b8', am, tint));
        break;
      }
      default: { // 礫石（小石子）
        const cols = ['#8a8a94', '#7a7a84', '#9a9aa4'];
        fill(x, gy, 2, 1, shade(cols[Math.floor(r2 * 3)], am, tint));
        fill(x + 1, gy - 1, 1, 1, shade('#b0b0b8', am, tint));
      }
    }
  }
  // 苔蘚：長在岸邊土壁與下緣
  for (let i = 0; i < 20; i++) {
    const r1 = seededRand(i * 17 + 3);
    const r2 = seededRand(i * 23 + 9);
    const x = landW + Math.floor(r1 * 2);
    const y = gy + 4 + Math.floor(r2 * Math.max(1, LH - gy - 8));
    fill(x, y, 2, 2, shade('#4c8a3a', am, tint));
  }
}

// 小型近海漁船模型（2× 高精細：船頭船尾、船舷、甲板木板、護欄、船艙、儲物箱、釣具架、繫纜樁、船槳，隨波浪起伏搖擺）
function drawBoat() {
  const t = performance.now() / 1000;
  const tint = lighting.warm - lighting.cool;
  const bob = boatBob();
  const sway = (Math.sin(t * 1.4) > 0 ? 1 : 0);
  const by = bankTop() + bob;
  const hull = shade('#8a5a2a', lighting.ambient, tint);
  const hullHi = shade('#a8743c', lighting.ambient, tint);
  const hullLo = shade('#5a3a1e', lighting.ambient, tint);
  const deck = shade('#7a5226', lighting.ambient, tint);
  const dark = shade('#4a2e14', lighting.ambient, tint);
  // 船體（吃水線，含亮/暗層次）
  fill(0, by, landW + 4, 6, hull);
  fill(0, by, landW + 4, 2, hullHi);
  fill(0, by + 4, landW + 4, 2, hullLo);
  // 船頭（尖）/ 船尾（依朝向）
  if (state.boatDir === 'right') {
    fill(landW + 4, by + 2, 6, 3, dark);
    fill(landW + 9, by + 2, 2, 2, dark);
  } else {
    fill(0, by + 2, 6, 3, dark);
    fill(-3, by + 2, 2, 2, dark);
  }
  // 甲板木板紋理（含板縫與磨損）
  fill(0, by, landW + 4, 2, deck);
  fill(0, by, landW + 4, 1, hullHi);
  for (let i = 3; i < landW + 2; i += 4) fill(i, by + 1, 2, 1, shade('#6a4a20', lighting.ambient, tint));
  fill(4, by + 1, 2, 1, shade('#5a3e1a', lighting.ambient, tint));
  fill(landW - 3, by + 1, 2, 1, shade('#5a3e1a', lighting.ambient, tint));
  // 船舷護欄（雙層）
  fill(0, by - 2, landW + 4, 2, shade('#6a4a2a', lighting.ambient, tint));
  fill(0, by - 2, landW + 4, 1, shade('#8a6a3a', lighting.ambient, tint));
  // 船艙（含窗與反光）
  const cabX = state.boatDir === 'right' ? 6 : landW - 14;
  fill(cabX, by - 8, 9, 8, shade('#6a4a2a', lighting.ambient, tint));
  fill(cabX, by - 8, 9, 2, shade('#8a6a3a', lighting.ambient, tint));
  fill(cabX + 1, by - 6, 3, 3, shade('#5a8ac0', lighting.ambient, tint));   // 窗
  fill(cabX + 1, by - 6, 1, 3, shade('#8ab8e0', lighting.ambient, tint));   // 窗反光
  // 儲物箱（含亮面）
  const boxX = state.boatDir === 'right' ? landW - 7 : 5;
  fill(boxX, by - 4, 6, 4, shade('#9a7a4a', lighting.ambient, tint));
  fill(boxX, by - 4, 6, 1, shade('#7a5a2a', lighting.ambient, tint));
  fill(boxX, by - 3, 1, 3, shade('#b08858', lighting.ambient, tint));
  // 釣具架
  const rodX = state.boatDir === 'right' ? landW - 2 : 8;
  fill(rodX, by - 6, 2, 6, shade('#5a3a1e', lighting.ambient, tint));
  fill(rodX, by - 8, 2, 2, shade('#7a4a2a', lighting.ambient, tint));
  // 繫纜樁（含亮面）
  fill(state.boatDir === 'right' ? 4 : landW - 1, by - 4, 4, 4, shade('#8a6a3a', lighting.ambient, tint));
  fill(state.boatDir === 'right' ? 4 : landW - 1, by - 4, 4, 1, shade('#a88050', lighting.ambient, tint));
  // 船槳
  const oarX = state.boatDir === 'right' ? landW - 4 : 4;
  fill(oarX, by + 2, 8, 2, shade('#6a4a2a', lighting.ambient, tint));
  fill(oarX + 8, by + 1, 3, 3, shade('#8a5a2a', lighting.ambient, tint));
  // 桅杆 + 繩索（隨船搖擺）
  const mastX = cabX + 4 + sway;
  fill(mastX, by - 18, 2, 10, dark);
  fill(mastX, by - 18, 1, 10, shade('#6a4a2a', lighting.ambient, tint));
  line(cabX + 5, by - 14, mastX, by - 16, shade('#3a2a1a', lighting.ambient, tint), 1);
  // 方向旗（隨船搖擺）
  const flagX = state.boatDir === 'right' ? landW + 1 : 8;
  fill(flagX, by - 14 + sway * 2, 2, 4, dark);
  fill(flagX + (state.boatDir === 'right' ? 2 : -2), by - 14 + sway * 2, 4, 2, shade(FLAG_COLORS[state.boatFlag] || '#e8b830', lighting.ambient, tint));
  // 錨（隨船搖擺）
  const ax = (state.boatDir === 'right' ? landW + 2 : 6) + sway;
  fill(ax, by + 5, 2, 4, dark);
  fill(ax - 1, by + 9, 5, 2, shade('#4a4a5a', lighting.ambient, tint));
  fill(ax, by + 11, 2, 4, shade('#4a4a5a', lighting.ambient, tint));
}

// 地形（岸 / 碼頭），顏色統一接受光照/天氣影響
function drawTerrain() {
  const spot = SPOTS[state.currentSpot];
  const tint = lighting.warm - lighting.cool;
  if (spot.type === 'pier') {
    // 木棧道（2×：較厚木板 + 亮線 + 木紋 + 支柱 + 欄杆 + 繩索）
    fill(0, bankTop(), landW + 6, 4, shade('#a8743c', lighting.ambient, tint));
    fill(0, bankTop(), landW + 6, 1, shade('#c88a50', lighting.ambient, tint));
    fill(0, bankTop() + 1, landW + 6, 1, shade('#8a5a2a', lighting.ambient, tint));
    // 木紋（細橫線）
    for (let i = 3; i < landW + 4; i += 6) fill(i, bankTop() + 2, 3, 2, shade('#8a5a2a', lighting.ambient, tint));
    // 支柱（深入水面）
    for (let i = 5; i < landW + 4; i += 10) {
      fill(i, bankTop() + 4, 3, 14, shade('#7a4a2a', lighting.ambient, tint));
      fill(i, bankTop() + 4, 1, 14, shade('#5a3a1e', lighting.ambient, tint));   // 支柱陰影面
    }
    fill(0, bankTop() - 2, landW + 6, 2, shade('#8a5a2b', lighting.ambient, tint)); // 欄杆
    fill(0, bankTop() - 2, landW + 6, 1, shade('#a88050', lighting.ambient, tint)); // 欄杆亮面
    // 繫纜繩（從繫纜樁垂入水面）
    line(5, bankTop() - 1, 8, bankTop() + 8, shade('#3a2a1a', lighting.ambient, tint), 1);
    line(8, bankTop() + 8, 6, bankTop() + 8, shade('#3a2a1a', lighting.ambient, tint), 1);
  } else if (spot.type === 'sea') {
    drawBoat();   // 開闊海域專屬漁船模型
  } else if (spot.type === 'fantasy') {
    if (state.currentSpot === 'sky') {
      // 雲海天池：浮空平台（較厚）
      fill(0, bankTop(), landW, 6, shade('#8a9ab8', lighting.ambient, tint));
      fill(0, bankTop(), landW, 2, shade('#aab8d0', lighting.ambient, tint));
      fill(4, bankTop() + 6, 4, 8, shade('#5a6a88', lighting.ambient, tint));
      fill(landW - 12, bankTop() + 6, 4, 8, shade('#5a6a88', lighting.ambient, tint));
    } else {
      // 螢光湖：草地岸
      fill(0, bankTop(), landW, LH - bankTop(), shade(spot.land, lighting.ambient, tint));
      fill(0, bankTop(), landW, 2, shade(spot.landDark, lighting.ambient, tint));
      fill(landW, bankTop(), 4, LH - bankTop(), shade(spot.landDark, lighting.ambient, tint));
    }
  } else {
    // 左岸土地（草地 / 沼澤泥地），分受光面與下方深色
    fill(0, bankTop(), landW, LH - bankTop(), shade(spot.land, lighting.ambient, tint));
    fill(0, bankTop(), landW, 2, shade(spot.landDark, lighting.ambient, tint));
    fill(0, bankTop() + 28, landW, LH - bankTop() - 28, shade(spot.landDark, lighting.ambient, tint));
    fill(landW, bankTop(), 4, LH - bankTop(), shade(spot.landDark, lighting.ambient, tint)); // 岸邊土壁
    // 草叢（兩層色，2× 較大）
    const g1 = shade('#7ad08a', lighting.ambient, tint);
    const g2 = shade('#5cb06a', lighting.ambient, tint);
    for (let i = 3; i < landW - 2; i += 6) {
      fill(i, bankTop() - 2, 2, 2, g1);
      fill(i + 2, bankTop() - 2, 2, 2, g2);
    }
  }
}

// 漁夫（解析度 ×2 高精細：輪廓、五官、衣物亮/固/暗層次、待機呼吸起伏、眨眼、夜晚自動提燈）
function drawFisherman() {
  const fx = fisherX;
  const fy = bankTop() + boatBob();   // 腳底（影子用，開闊海域時隨船體起伏）
  const a = charAnchor();             // 上半身錨點（與釣竿共用，擺動一致）
  const by = a.by, px = a.px;
  const t = performance.now() / 1000;
  const tint = lighting.warm - lighting.cool;
  const c = {
    outline: shade('#241610', lighting.ambient, tint),   // 輪廓
    hat: shade(HAT_COLORS[state.hatColor] || '#3a6ea5', lighting.ambient, tint),
    hatHi: shade(HAT_COLORS[state.hatColor] || '#3a6ea5', Math.min(1.2, lighting.ambient + 0.2), tint),
    hatDark: shade(HAT_COLORS[state.hatColor] || '#3a6ea5', lighting.ambient * 0.7, tint),
    band: shade('#e8b830', lighting.ambient, tint),
    skin: shade('#f2c894', lighting.ambient, tint),
    skinHi: shade('#fbe0bc', lighting.ambient, tint),
    skinDark: shade('#c89660', lighting.ambient, tint),
    shirt: shade('#e8735a', lighting.ambient, tint),
    shirtHi: shade('#f89880', lighting.ambient, tint),
    shirtDark: shade('#c05a48', lighting.ambient, tint),
    vest: shade('#8a5a3a', lighting.ambient, tint),
    vestDark: shade('#6a4028', lighting.ambient, tint),
    pants: shade('#3a4a6a', lighting.ambient, tint),
    pantsDark: shade('#2a3852', lighting.ambient, tint),
    boot: shade('#5a4a2a', lighting.ambient, tint),
    bootHi: shade('#6a5a3a', lighting.ambient, tint),
  };
  // 海底場景：穿戴潛水裝備（潛水服配色）
  if (state.currentSpot === 'underwater') {
    c.shirt = shade('#12303e', lighting.ambient, tint);
    c.shirtHi = shade('#1a3e4e', lighting.ambient, tint);
    c.shirtDark = shade('#0c2230', lighting.ambient, tint);
    c.vest = shade('#1a4a5a', lighting.ambient, tint);
    c.vestDark = shade('#123038', lighting.ambient, tint);
    c.pants = shade('#0e2a3a', lighting.ambient, tint);
    c.pantsDark = shade('#081e2a', lighting.ambient, tint);
    c.boot = shade('#12303e', lighting.ambient, tint);
    c.bootHi = shade('#1a3e4e', lighting.ambient, tint);
    c.hat = shade('#0e2a3a', lighting.ambient, tint);
    c.hatHi = shade('#16303e', lighting.ambient, tint);
    c.hatDark = shade('#0a1e2a', lighting.ambient, tint);
    c.band = shade('#1a4a5a', lighting.ambient, tint);
  }
  drawShadow(fx, fy, 12);   // 影子（隨日照方向/長度，解析度 ×2 加寬）

  // 腿 + 靴（雙層亮/暗，體積感）
  fill(fx - 5, by - 8, 4, 5, c.pants);
  fill(fx - 5, by - 8, 1, 5, c.pantsDark);
  fill(fx + 2, by - 8, 4, 5, c.pants);
  fill(fx + 5, by - 8, 1, 5, c.pantsDark);
  fill(fx - 5, by - 3, 4, 3, c.boot);
  fill(fx - 5, by - 3, 4, 1, c.bootHi);
  fill(fx - 5, by - 1, 4, 1, shade('#3a2e18', lighting.ambient, tint));   // 靴底
  fill(fx + 2, by - 3, 4, 3, c.boot);
  fill(fx + 2, by - 3, 4, 1, c.bootHi);
  fill(fx + 2, by - 1, 4, 1, shade('#3a2e18', lighting.ambient, tint));   // 靴底

  // 身體（輪廓 + 亮面/固有色/陰影 + 背心 + 衣領層次）
  fill(px - 6, by - 18, 12, 10, c.outline);
  fill(px - 5, by - 18, 10, 10, c.shirt);
  fill(px - 5, by - 18, 10, 2, c.shirtDark);          // 領口陰影
  fill(px - 5, by - 17, 10, 1, c.shirtHi);            // 肩部高光
  fill(px - 2, by - 16, 4, 6, c.vest);                // 背心
  fill(px - 2, by - 16, 4, 1, c.vestDark);            // 背心陰影
  fill(px - 2, by - 16, 1, 6, c.vestDark);            // 背心左緣陰影

  // 手臂（持竿，含手部亮/暗）
  fill(px + 5, by - 18, 4, 6, c.skin);
  fill(px + 5, by - 15, 4, 1, c.skinDark);
  fill(px + 5, by - 18, 1, 6, c.skinHi);

  // 頭（輪廓 + 臉 + 五官 + 眨眼）
  ellipse(px, by - 24, 14, 14, c.outline);
  ellipse(px, by - 24, 10, 10, c.skin);
  ellipse(px, by - 25, 8, 5, c.skinHi);               // 額頭/臉頰高光
  fill(px + 1, by - 23, 1, 1, c.skinDark);            // 鼻
  fill(px, by - 21, 3, 1, c.skinDark);                // 嘴

  // 帽子（帽頂 + 帽身 + 帽簷陰影 + 飾帶；還原為原本比例，放大 2×，對齊頭頂 by-31）
  fill(px - 4, by - 31, 10, 4, c.hat);                // 帽頂
  fill(px - 6, by - 27, 14, 2, c.hat);                // 帽身
  fill(px - 6, by - 25, 14, 2, c.hatDark);            // 帽簷下方陰影
  fill(px - 2, by - 27, 6, 2, c.band);                // 飾帶

  // 水手圍巾（頸部，雙層）
  fill(px - 2, by - 18, 5, 2, shade('#b03030', lighting.ambient, tint));
  fill(px - 2, by - 17, 5, 1, shade('#c84848', lighting.ambient, tint));
  // 皮帶＋銅扣（腰部）
  fill(px - 4, by - 9, 8, 2, shade('#4a3018', lighting.ambient, tint));
  fill(px, by - 9, 2, 2, shade('#d8a060', lighting.ambient, tint));
  // 靴子濕潤泥點與海水反光
  fill(fx - 2, by - 2, 1, 1, shade('#4a2e18', lighting.ambient, tint));
  fill(fx + 3, by - 2, 1, 1, shade('#4a2e18', lighting.ambient, tint));
  fill(fx - 4, by - 3, 1, 1, shade('#7aa8c8', lighting.ambient, tint));   // 海水反光
  // 疲憊姿勢：低頭（失敗時）
  if (phase === 'fail') {
    fill(px - 2, by - 20, 4, 2, c.skinDark);   // 低頭陰影
  }

  // 海底場景：潛水鏡 + 氧氣瓶（僅在此地圖顯示，切回陸上自動移除）
  if (state.currentSpot === 'underwater') {
    fill(px - 8, by - 20, 4, 10, shade('#2a4a5a', lighting.ambient, tint));   // 氧氣瓶
    fill(px - 8, by - 20, 2, 10, shade('#4a6a7a', lighting.ambient, tint));   // 瓶身反光
    fill(px - 6, by - 10, 2, 1, shade('#0a1a24', lighting.ambient, tint));    // 瓶底
    fill(px, by - 28, 6, 4, shade('#0a1a24', lighting.ambient, tint));        // 潛水鏡框
    fill(px + 2, by - 27, 2, 2, shade('#5ab0d8', lighting.ambient, tint));    // 鏡片
  }

  // 夜晚自動拿出提燈照明
  lampX = px - 4; lampY = by - 16;   // 記錄燈具位置（人物半身高處，解析度 ×2）
  if (lighting.cool > 0.35) drawLantern(lampX, lampY);
}

// 夜晚提燈本體（掛在人物半身高處；光照由 drawLampLight 以加法混合完成）
function drawLantern(x, y) {
  fill(x, y - 4, 2, 4, '#5a4a2a');       // 掛繩
  fill(x - 2, y, 6, 2, '#8a6a3a');       // 頂
  fill(x - 2, y + 2, 6, 6, '#c89030');   // 燈身
  fill(x - 2, y + 2, 6, 2, '#e8a840');   // 燈身亮面
  fill(x, y + 4, 2, 2, '#ffe066');       // 燈芯
  fill(x, y + 6, 2, 2, '#fff6c0');       // 高光
  fill(x - 1, y + 8, 2, 1, '#8a6a3a');   // 底
}

// 燈具照明：以光源為中心、依距離衰減，用「加法混合」逐像素提升周圍亮度，
// 保留底層紋理與光影，且受晝夜（夜色越深越亮）與天氣（霧/雨減弱）影響。
function drawLampLight() {
  if (lighting.cool < 0.3) return;   // 白天不點燈
  let strength = lighting.cool * (1 - weather.fog * 0.5) * (1 - weather.rain * 0.25);
  strength = clamp(strength, 0, 1);
  if (strength <= 0.02) return;

  const cx = lampX * S, cy = lampY * S;
  const r = 72 * S;   // 解析度 ×2 後擴大光照半徑，維持相同螢幕光暈
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(255,205,120,' + (0.90 * strength).toFixed(3) + ')');
  g.addColorStop(0.35, 'rgba(255,185,95,' + (0.38 * strength).toFixed(3) + ')');
  g.addColorStop(0.7, 'rgba(255,170,85,' + (0.14 * strength).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,160,80,0)');

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';   // 加法混合：提升底層像素亮度，不是覆蓋半透明層
  ctx.fillStyle = g;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.restore();
}

// 魚竿與釣線（每根竿有專屬外觀與顏色，拉扯時竿身彎曲）
function drawRodAndLine() {
  const rod = RODS[state.currentRod];
  const tint = lighting.warm - lighting.cool;
  const a = charAnchor();
  const base = { x: a.px + 6, y: a.by - 16 };  // 竿座跟隨人物擺動（解析度 ×2）
  const tip = currentRodTip();
  const shaftCol = shade(rod.color, lighting.ambient, tint);
  const shaftHi = shade(rod.color, Math.min(1.2, lighting.ambient + 0.2), tint);
  const bending = (phase === 'fight' && holding);   // 拉扯時魚竿彎曲
  const thick = rod.reel >= 3.3 ? 5 : 4;            // 高階竿較粗，輪廓更明顯（解析度 ×2）

  if (bending) {
    // 兩段式：竿身筆直 + 竿尖下彎（模擬受力彎曲）
    const unbent = getRodTip();
    const mid = { x: base.x + Math.round((unbent.x - base.x) * 0.6), y: base.y + Math.round((unbent.y - base.y) * 0.6) };
    line(base.x, base.y, mid.x, mid.y, shaftCol, thick);   // 竿身筆直段
    line(mid.x, mid.y, tip.x, tip.y, shaftCol, thick);     // 竿尖下彎段
  } else {
    line(base.x, base.y, tip.x, tip.y, shaftCol, thick);
    line(base.x + 1, base.y + 1, tip.x, tip.y, shaftHi, 1);  // 竿身亮面
  }
  // 竿尖（較亮的顏色，各竿不同）
  line(tip.x - 4, tip.y + 2, tip.x, tip.y, shade(rod.tip, lighting.ambient, tint), 2);
  // 捲線器（依魚竿不同顏色）
  fill(base.x, base.y - 2, 2, 2, shade(rod.reelColor, lighting.ambient, tint));
  fill(base.x, base.y - 2, 2, 1, shade(rod.reelColor, Math.min(1.2, lighting.ambient + 0.2), tint));
  // 高階竿：竿尖光暈（龍骨/星光/神話）
  if (rod.special === 'legend' || rod.special === 'star' || rod.special === 'myth') {
    fill(tip.x, tip.y - 2, 2, 2, '#fff6c0');
    fill(tip.x + 2, tip.y, 2, 2, rod.special === 'star' ? '#e0c0ff' : '#ffe066');
  }
}

// 浮標
function drawBobber(t) {
  if (phase === 'idle') return;
  const tip = currentRodTip();   // 釣線從竿尖出發（拉扯時跟隨彎曲的竿尖）
  let bx, by;
  if (phase === 'cast') { bx = bobber.x; by = bobber.y; }
  else {
    bx = bobber.tx; by = bobber.ty;
    if (phase === 'waiting') by += (Math.sin(t * 4) > 0 ? 0 : 2);
    if (phase === 'fight') by += 2;
  }
  line(tip.x, tip.y, bx, by, '#d8e8f0', 1);
  // 浮標（解析度 ×2：白身 + 紅頂 + 高光）
  fill(bx, by, 2, 2, '#ffffff');
  fill(bx + 2, by, 1, 2, '#e63946');
  fill(bx, by, 1, 1, '#e8f2ff');
}

// 拉扯 / 釣到時的特效
function drawFightEffects(t) {
  if (phase === 'fight') {
    // 驚嘆號
    fill(bobber.tx, waterY - 9, 1, 1, '#ffd75e');
    fill(bobber.tx, waterY - 8, 1, 2, '#ffd75e');
    // 水花
    fill(bobber.tx - 2, waterY, 1, 1, '#dff2ff');
    fill(bobber.tx + 2, waterY - 1, 1, 1, '#dff2ff');
  }
  if (phase === 'caught') {
    // 釣到魚：躍出水面拋物線演出
    const p = clamp((performance.now() - caughtStart) / 1800, 0, 1);
    const arc = Math.sin(p * Math.PI);
    const fy = waterY - 3 - arc * 20;
    drawFish(fight.fishId, bobber.tx, fy, 1, t);
    // 水花
    if (p < 0.35) {
      ctx.fillStyle = 'rgba(220,240,255,0.8)';
      for (let i = 0; i < 7; i++) {
        const sx = bobber.tx - 4 + i;
        const sy = waterY - Math.round(Math.sin(i * 1.5 + t * 12) * 2);
        ctx.fillRect(sx * S, sy * S, S, S);
      }
    }
  }
}

/* ---------- 六、魚的繪製 ---------- */

function drawFish(id, cx, cy, dir, t) {
  const f = FISH[id];
  cx = Math.round(cx); cy = Math.round(cy);
  // 特殊外型魚：水母、魔鬼魚用專屬繪製
  if (id === 'jelly') { drawJelly(cx, cy, t); return; }
  if (id === 'manta') { drawManta(cx, cy, dir, t); return; }

  const tint = lighting.warm - lighting.cool;
  const L = f.size * 2;                                       // 2× 體長
  const H = 2 * Math.max(4, Math.round(f.size * 0.5));        // 2× 體高
  const halfH = H / 2;
  const c = f.colors;
  const rc = ramp(c.body);
  // 統一光照下的多階色（陰影 / 固有色 / 亮面 / 高光）
  const outline = shade(c.outline, lighting.ambient, tint);
  const body    = shade(c.body, lighting.ambient, tint);
  const back    = shade(rc.lo, lighting.ambient, tint);                    // 背部陰影
  const backMid = shade(c.body, lighting.ambient * 0.86, tint);            // 背中過渡
  const belly   = shade(c.belly, lighting.ambient, tint);
  const bellyMid= shade(c.belly, lighting.ambient * 0.9, tint);            // 腹中過渡
  const fin     = shade(c.fin, lighting.ambient, tint);
  const finDark = shade(c.fin, lighting.ambient * 0.78, tint);
  const spec    = shade(rc.spec, lighting.ambient, tint);                  // 背部高光
  const wag     = Math.round(Math.sin(t * 8 + cx * 0.7));                  // 游動擺動（離散像素）

  // 外框 + 身體
  ellipse(cx, cy, L + 4, H + 4, outline);
  ellipse(cx, cy, L, H, body);
  // 背部（上半：陰影 → 中調，兩層過渡）
  for (let r = 0; r < halfH; r++) {
    const d = (r - (H - 1) / 2) / ((H - 1) / 2);
    const w = Math.max(1, Math.round((L / 2 - 2) * Math.sqrt(Math.max(0, 1 - d * d))));
    fill(cx - w, cy - halfH + r, w * 2, 1, r < Math.round(halfH * 0.45) ? back : backMid);
  }
  // 腹部（下半：中調 → 亮，兩層過渡）
  for (let r = halfH; r < H; r++) {
    const d = (r - (H - 1) / 2) / ((H - 1) / 2);
    const w = Math.max(1, Math.round((L / 2 - 2) * Math.sqrt(Math.max(0, 1 - d * d))));
    fill(cx - w, cy - halfH + r, w * 2, 1, r < halfH + Math.round((H - halfH) * 0.35) ? bellyMid : belly);
  }
  // 背部高光（沿背脊一道亮線）
  for (let i = 0; i < Math.floor(L / 4); i++) {
    const sx = cx - Math.floor(L / 2) + 3 + i * 2;
    if (sx < cx - Math.floor(L / 2) || sx > cx + Math.floor(L / 2) - 2) continue;
    fill(sx, cy - halfH + 1, 2, 1, spec);
  }

  // 鱗片紋理（細小弧線斑點，兩行錯開）
  const scaleCol = shade(c.body, lighting.ambient * 0.8, tint);
  for (let i = 0; i < Math.max(4, Math.floor(L / 2)); i++) {
    const sx = cx - Math.floor(L / 3) + i;
    const sy = cy + (i % 2 ? 1 : -1);
    if (sx > cx - Math.floor(L / 2) + 1 && sx < cx + Math.floor(L / 2) - 1) fill(sx, sy, 1, 1, scaleCol);
  }

  // 尾鰭（-dir 方向，隨游動擺動，分叉造型）
  const tx = cx - dir * Math.floor(L / 2);   // 魚身尾端
  const ty = cy + wag;
  if (dir > 0) {
    fill(tx - 3, ty - 2, 3, 5, finDark);     // 基部
    fill(tx - 7, ty - 3, 4, 3, fin);         // 上叉
    fill(tx - 7, ty + 1, 4, 3, fin);         // 下叉
    fill(tx - 4, ty - 1, 1, 3, finDark);     // 中缺口
  } else {
    fill(tx, ty - 2, 3, 5, finDark);         // 基部
    fill(tx + 3, ty - 3, 4, 3, fin);         // 上叉
    fill(tx + 3, ty + 1, 4, 3, fin);         // 下叉
    fill(tx + 3, ty - 1, 1, 3, finDark);     // 中缺口
  }

  // 背鰭 + 胸鰭（胸鰭隨游動微動）
  fill(cx - 2, cy - halfH - 2, 4, 2, fin);
  fill(cx - 2, cy - halfH - 2, 4, 1, finDark);
  fill(cx - dir * 2, cy + 2 + wag, 3, 1, fin);

  // 眼睛（+dir 方向，頭部，含眼神高光）
  const ex = cx + dir * Math.floor(L / 3);
  fill(ex, cy - 2, 2, 2, '#1a1a1a');
  fill(ex + dir, cy - 2, 1, 1, '#ffffff');

  // 嘴巴
  fill(cx + dir * Math.floor(L / 2 - 2), cy, 2, 1, '#1a1a1a');

  // 鰓蓋（弧形，兩層增加結構）
  fill(cx + dir * Math.floor(L / 4), cy - 2, 1, 4, shade(c.body, lighting.ambient * 0.7, tint));
  fill(cx + dir * Math.floor(L / 4) - dir, cy - 1, 1, 2, shade(c.body, lighting.ambient * 0.8, tint));

  // ---- 物種特色（2×）----
  if (id === 'bass') {
    for (let i = -2; i <= 2; i++) fill(cx + i * 2, cy - halfH, 2, H - 4, outline); // 條紋
  } else if (id === 'puffer') {
    for (let i = -3; i <= 3; i++) if (i !== 0) fill(cx + i * 2, cy - halfH - 2, 2, 2, outline); // 刺
  } else if (id === 'shark') {
    fill(cx - dir * 2, cy - halfH - 5, 3, 5, fin); // 大背鰭
    fill(cx - dir * 2, cy - halfH - 5, 3, 1, finDark);
    fill(cx - dir * 3, cy - halfH - 3, 2, 2, fin);
  } else if (id === 'dragon') {
    fill(cx + dir * Math.floor(L / 2), cy + 2, -dir * 3, 2, outline); // 鬚
    fill(cx + dir * Math.floor(L / 2), cy - 2, -dir * 3, 2, outline);
    fill(cx + dir * Math.floor(L / 2 - 2), cy - halfH - 2, 2, 3, shade('#e89820', lighting.ambient, tint)); // 角
  } else if (id === 'tuna') {
    fill(tx + dir, cy - 2, 2, 2, fin); // 尾柄小鰭
  } else if (id === 'angler') {
    // 燈籠魚：頭頂發光釣餌
    fill(cx + dir * Math.floor(L / 2 - 2), cy - halfH - 4, 2, 4, outline);   // 觸鬚
    fill(cx + dir * Math.floor(L / 2 - 2), cy - halfH - 6, 2, 2, '#ffe066'); // 發光餌
  } else if (id === 'rainbow') {
    // 彩虹魚：七彩橫紋（發光）
    const cols = ['#ff6a6a', '#ffc060', '#6aff6a', '#6ac0ff', '#a080ff'];
    for (let i = 0; i < 5; i++) fill(cx - 5 + i * 2, cy - halfH, 2, H - 4, cols[i]);
  } else if (id === 'stardust') {
    // 星光魚：發光星點（更大更亮）
    fill(cx - 4, cy - 2, 2, 2, '#ffe080');
    fill(cx + 2, cy - halfH + 2, 2, 2, '#ffe080');
    fill(cx, cy + 2, 2, 2, '#c0e0ff');
    fill(cx - 2, cy - halfH + 2, 2, 2, '#e0c0ff');
  } else if (id === 'crystal') {
    // 水晶魚：背部晶簇（棱柱，更大）
    for (let i = 0; i < 3; i++) {
      fill(cx - 4 + i * 4, cy - halfH - 4 - i, 2, 4 + i * 2, shade('#7ae8c8', lighting.ambient, tint));
      fill(cx - 4 + i * 4, cy - halfH - 6 - i, 2, 2, shade('#d0fff0', lighting.ambient, tint));
    }
  } else if (id === 'clouddragon') {
    // 雲龍：角＋翼鰭＋鬚
    fill(cx + dir * Math.floor(L / 2 - 2), cy - halfH - 4, 2, 5, fin);       // 角
    fill(cx + dir * Math.floor(L / 2 - 4), cy - halfH - 6, 2, 2, fin);
    fill(cx + dir * Math.floor(L / 2), cy + 2, -dir * 3, 2, outline);        // 鬚
    fill(cx + dir * Math.floor(L / 2), cy - 2, -dir * 3, 2, outline);
    fill(cx - dir * 3, cy - halfH - 2, 2, 2, shade('#c0d8ff', lighting.ambient, tint)); // 翼鰭
  } else if (id === 'deepdragon') {
    // 深海龍魚：發光餌＋鋸齒背鰭＋異形輪廓
    fill(cx + dir * Math.floor(L / 2 - 2), cy - halfH - 6, 2, 6, outline);   // 觸鬚
    fill(cx + dir * Math.floor(L / 2 - 2), cy - halfH - 8, 2, 2, '#c0ff80'); // 發光餌
    for (let i = -3; i <= 3; i++) fill(cx + i, cy - halfH - 2, 2, 2, fin);   // 鋸齒背鰭
  }
}

// 水母（傘狀 + 擺動觸鬚，2× 高精細）
function drawJelly(cx, cy, t) {
  const f = FISH.jelly;
  const tint = lighting.warm - lighting.cool;
  const dome = shade(f.colors.body, lighting.ambient, tint);
  const domeHi = shade(f.colors.belly, lighting.ambient, tint);
  const out = shade(f.colors.outline, lighting.ambient, tint);
  ellipse(cx, cy - 2, 18, 12, out);
  ellipse(cx, cy - 2, 14, 10, dome);
  fill(cx - 4, cy - 4, 6, 2, domeHi);   // 傘頂高光
  fill(cx - 2, cy - 5, 4, 1, domeHi);
  for (let i = 0; i < 6; i++) {
    const tx = cx - 5 + i * 2;
    const sway = Math.round(Math.sin(t * 3 + i * 1.2));
    fill(tx, cy + 6, 2, 4 + (i % 2) * 2, dome);
    fill(tx + sway, cy + 10 + (i % 2) * 2, 1, 2, dome);
  }
}

// 魔鬼魚（寬翼菱形 + 長尾，2× 高精細，翅膀微動）
function drawManta(cx, cy, dir, t) {
  const f = FISH.manta;
  const tint = lighting.warm - lighting.cool;
  const body = shade(f.colors.body, lighting.ambient, tint);
  const bodyHi = shade(f.colors.body, Math.min(1.2, lighting.ambient + 0.15), tint);
  const belly = shade(f.colors.belly, lighting.ambient, tint);
  const out = shade(f.colors.outline, lighting.ambient, tint);
  const flap = Math.round(Math.sin(t * 4 + cx));   // 翅膀微動
  fill(cx - 10, cy - 2 + flap, 8, 6, out);
  fill(cx + 2, cy - 2 - flap, 8, 6, out);
  fill(cx - 8, cy - 2 + flap, 6, 5, body);
  fill(cx + 2, cy - 2 - flap, 6, 5, body);
  fill(cx - 8, cy - 3 + flap, 6, 1, bodyHi);
  ellipse(cx, cy, 8, 6, body);
  fill(cx - 2, cy, 4, 2, belly);
  fill(cx + 8, cy, dir * 4, 2, body);   // 長尾
  fill(cx - 4, cy - 2, 2, 2, '#1a1a1a');
  fill(cx - 5, cy - 2, 1, 1, '#ffffff');
}

// 水中環境魚
let ambient = [];
function genAmbient() {
  ambient = [];
  const ids = Object.keys(spotFishPool());
  const underwater = state.currentSpot === 'underwater';
  const n = underwater ? 11 : (2 + Math.floor(Math.random() * 2));   // 海底魚群較多，自由游動
  for (let i = 0; i < n; i++) {
    ambient.push({
      id: ids[Math.floor(Math.random() * ids.length)],
      x: (underwater ? 1 : waterLeft() + 4) + Math.random() * (underwater ? LW - 2 : LW - waterLeft() - 8),
      y: (underwater ? 2 : waterY + 4) + Math.random() * (underwater ? LH - 4 : LH - waterY - 10),
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: 0.8 + Math.random() * 2.4,
      phase: Math.random() * 6.28,
    });
  }
}

// 泡泡
let bubbles = [];
function spawnBubble() {
  bubbles.push({ x: waterLeft() + 2 + Math.random() * (LW - waterLeft() - 4), y: LH + 2, r: 1 + Math.random() * 2, sp: 0.5 + Math.random() * 0.6, ph: Math.random() * 6.28 });
}

/* ---------- 七、遊戲流程 ---------- */

// phase: idle / cast / waiting / fight / caught / fail
let phase = 'idle';
let holding = false;
let fight = { fishId: null, progress: 0, tension: 0, timeLeft: 0, zoneLow: 0, zoneHigh: 0, zoneCenterF: 0.5, zoneTargetF: 0.5, zoneTimer: 0, calm: false, extend: false };
let castBaitId = 'worm';   // 這次拋竿用的魚餌（成功釣到才扣耐久）
let bobber = { x: 0, y: 0, tx: 0, ty: 0 };
let castStart = 0;
let castP = 0;   // 拋竿動畫進度 0..1（供甩竿動畫使用）
let lampX = 0, lampY = 0;   // 燈具目前位置（供燈具本體與照明光共用）
let pendingItem = null;     // 下次釣魚生效的道具（attract / calm / extend）
let castBiteWait = 3000;    // 本次拋竿的咬鉤等待時間（可被道具縮短）
let biteTimer = null, resultTimer = null, toastTimer = null, reelTick = 0;
let fade = 0, fading = false, fadeDir = 0, pendingSpot = null;

function weightedPick(obj) {
  const ids = Object.keys(obj);
  if (ids.length === 0) return null;   // 修復：空集合時避免回傳 undefined（陣列索引 -1）
  const total = ids.reduce((s, id) => s + obj[id], 0);
  let r = Math.random() * total;
  for (const id of ids) { r -= obj[id]; if (r <= 0) return id; }
  return ids[ids.length - 1];
}

// 拋竿
function tryCast() {
  if (phase !== 'idle' || panelType || inMenu) return;
  if (state.baits[state.currentBait] <= 0) {
    showToast('這個魚餌用完了！去商店補充，或換別的魚餌。', 'bad');
    return;
  }
  const rod = RODS[state.currentRod];
  const bait = BAITS[state.currentBait];
  let pool = spotFishPool();
  // 限時稀有魚事件：該魚權重大增（並加入可釣清單）
  if (rareEvent && rareEvent.spotId === state.currentSpot && performance.now() < rareEvent.until) {
    pool = Object.assign({}, pool);
    pool[rareEvent.fishId] = (pool[rareEvent.fishId] || 0) + 100;
  }
  // 神話竿「萬物親和」：任何魚餌都能吸引到該釣點全部魚種
  const eligible = (rod.special === 'myth')
    ? Object.keys(pool)
    : Object.keys(pool).filter(id => bait.attract.includes(id));
  if (rareEvent && rareEvent.spotId === state.currentSpot && performance.now() < rareEvent.until && eligible.indexOf(rareEvent.fishId) === -1) {
    eligible.push(rareEvent.fishId);
  }
  if (eligible.length === 0) {
    showToast('這個魚餌在這裡釣不到魚，換個魚餌再試吧。', 'bad');
    return;
  }

  castBaitId = state.currentBait;   // 記下這次用的魚餌，釣到魚才扣耐久（拋竿本身不扣）
  state.stats.casts++;
  fight.fishId = weightedPick(pickSubset(pool, eligible));
  // 咬鉤等待：道具＋隨機事件＋浮漂靈敏度＋星光指引（夜晚）
  if (pendingItem === 'attract') { castBiteWait = 500 + Math.random() * 1000; pendingItem = null; }
  else castBiteWait = 1500 + Math.random() * 3000;
  if (performance.now() < biteBoostUntil) castBiteWait *= 0.5;
  castBiteWait *= (1 - rod.float);
  if (rod.special === 'star' && lighting.cool > 0.3) castBiteWait *= 0.7;
  const tip = getRodTip();
  bobber.x = tip.x; bobber.y = tip.y;
  bobber.tx = Math.round(LW * 0.62);   // 固定拋竿距離
  bobber.ty = waterY;
  phase = 'cast'; castStart = performance.now();
  sfxCast();
  updateHUD();
  setStatus('魚餌入水，等待魚上鉤...');
}

function pickSubset(obj, ids) {
  const out = {}; for (const id of ids) out[id] = obj[id]; return out;
}

// 咬鉤
function onBite() {
  closePanel();   // 魚上鉤時若還有開啟的介面，先關閉，避免遮住拉扯畫面與收線按鈕
  phase = 'fight';
  fight.progress = 0; fight.tension = 0;
  // 道具效果：安撫劑（穩定掙扎）／延時浮標（延長計時）
  fight.calm = (pendingItem === 'calm');
  fight.extend = (pendingItem === 'extend');
  fight.timeLeft = fight.extend ? ESCAPE_TIME + 10 : ESCAPE_TIME;
  pendingItem = null;
  fight.zoneCenterF = 0.5; fight.zoneTargetF = 0.5; fight.zoneTimer = 0.4;   // 張力安全區歸位
  holding = false; reelTick = 0;
  sfxBite();
  spawnSplash(bobber.tx, waterY);   // 魚咬鉤水花
  showFightUI(true);
  setStatus('魚上鉤了！按住空白鍵，讓張力保持在綠色安全區內收線！');
}

// 拉扯（每幀更新）——開發者模式可調整
let TENSION_RISE = 50, TENSION_FALL = 75, REEL_SPEED = 30, ESCAPE_LOSS = 7;   // 張力升降速率（每 100 耐久/秒）
let ESCAPE_TIME = 20;   // 魚上鉤後的逃脫倒數時間（秒），時間內沒釣起就逃走

function updateFight(dt) {
  const rod = RODS[state.currentRod];
  const fish = FISH[fight.fishId];
  const dur = LINE_DURABILITY;

  // 張力安全區：每隔一段時間隨機換目標、快速移動；尺寸隨魚種與魚竿改變
  fight.zoneTimer -= dt;
  if (fight.zoneTimer <= 0) {
    fight.zoneTargetF = 0.18 + Math.random() * 0.64;   // 隨機目標 0.18~0.82（範圍更大）
    fight.zoneTimer = 0.22 + Math.random() * 0.5;       // 0.22~0.72 秒換一次（更頻繁，難度提高）
  }
  const zoneVelFrac = (0.22 + fish.power * 0.028) * (1 - rod.resist) * (fight.calm ? 0.6 : 1);   // 移動速度（更快）
  const maxStep = zoneVelFrac * dur * dt;
  const delta = (fight.zoneTargetF - fight.zoneCenterF) * dur;
  fight.zoneCenterF += clamp(delta, -maxStep, maxStep) / dur;

  // 安全區寬度：隨魚種與魚竿（掙扎耐受度也會加寬）；深海竿「深潛」在海底更寬
  let zoneWidth = Math.max(0.04, 0.18 - fish.power * 0.018 + rod.resist * 0.12);
  if (rod.special === 'deep' && state.currentSpot === 'underwater') zoneWidth += 0.03;
  const center = dur * fight.zoneCenterF;
  const half = dur * zoneWidth;
  fight.zoneLow = center - half;
  fight.zoneHigh = center + half;

  // 張力（準心）：按住上升、放開下降
  if (holding) {
    fight.tension += TENSION_RISE * (dur / 100) * dt;
    reelTick += dt;
    if (reelTick > 0.14) { sfxReel(fight.tension / dur); reelTick = 0; }   // 收線音隨張力變化
  } else {
    fight.tension -= TENSION_FALL * (dur / 100) * dt;
  }
  // 漩渦持續拉力；漩渦竿「漩渦抗性」免疫
  if (state.currentSpot === 'underwater' && rod.special !== 'vortex') fight.tension += 12 * dt;
  fight.tension = clamp(fight.tension, 0, dur);

  // 收線進度（拉力決定速度）；海釣竿「海風之力」在海域加成
  let reelMul = rod.reel;
  if (rod.special === 'seabreeze' && state.currentSpot === 'sea') reelMul *= 1.15;
  if (fight.tension >= fight.zoneLow && fight.tension <= fight.zoneHigh) {
    fight.progress += reelMul * REEL_SPEED * dt;
  } else if (fight.tension < fight.zoneLow) {
    fight.progress -= fish.power * ESCAPE_LOSS * dt;
  } else {
    fight.progress -= fish.power * ESCAPE_LOSS * dt * 0.4;
  }
  fight.progress = clamp(fight.progress, 0, 100);

  fight.timeLeft -= dt;   // 逃脫倒數

  if (fight.progress >= 100) { onCaught(); return; }                                  // 收線完成
  if (fight.tension >= dur) { onFail('魚線斷了，魚跑掉了...'); return; }              // 張力爆表
  if (fight.timeLeft <= 0) { onFail('魚掙扎逃走了，本次釣魚失敗...'); return; }      // 時間到
}

// 釣到魚：放入魚簍（稍後手動賣出）
function onCaught() {
  phase = 'caught';
  holding = false;
  caughtStart = performance.now();   // 記錄躍出動畫起始時間
  spawnSplash(bobber.tx, waterY);     // 釣起瞬間水花
  showFightUI(false);
  const f = FISH[fight.fishId];
  state.fishCaught[fight.fishId]++;
  state.fishFound[fight.fishId] = 1;   // 永久記錄已捕獲，賣魚後圖鑑仍保留
  state.totalCaught++;
  // 魚餌耐久：成功釣到魚才消耗 1 次使用次數
  if (state.baits[castBaitId] > 0) state.baits[castBaitId]--;
  // 龍骨竿「傳說直覺」：釣到傳說魚額外獲得該魚售價 50%
  let legendBonus = 0;
  if (RODS[state.currentRod].special === 'legend' && f.rarity === '傳說') {
    legendBonus = Math.round(f.price * 0.5);
    state.coins += legendBonus;
  }
  // 統計：最大魚
  if (f.price > state.stats.bestPrice) { state.stats.bestPrice = f.price; state.stats.bestFish = f.name; }
  // 釣到限時稀有魚事件目標：結束事件（不再額外發金幣）
  if (rareEvent && rareEvent.fishId === fight.fishId && performance.now() < rareEvent.until) {
    rareEvent = null;
  }
  // 成就檢查
  checkAchievements();
  // 通關：釣到最終目標「深海龍魚」觸發通關畫面與劇情
  if (fight.fishId === 'deepdragon' && !victoryShown) {
    victoryShown = true;
    setTimeout(showVictory, 2400);   // 先播釣魚結果，再進入通關
  }
  saveGame();
  if (f.rarity === '傳說') sfxLegendaryCatch(); else sfxCatch();   // 傳說魚有專屬 fanfare
  updateHUD();
  let bonusTxt = '';
  if (legendBonus > 0) bonusTxt += ` 傳說直覺＋${legendBonus} 金幣`;
  showToast(`釣到了 ${f.name}！（已放入魚簍）` + bonusTxt, 'ok', 2200);
  clearTimeout(resultTimer);
  resultTimer = setTimeout(returnToIdle, 2200);
}

// 失敗（斷線 / 魚逃走）
function onFail(msg) {
  phase = 'fail';
  holding = false;
  showFightUI(false);
  sfxBreak();
  showToast(msg || '魚線斷了，魚跑掉了...', 'bad', 1600);
  clearTimeout(resultTimer);
  resultTimer = setTimeout(returnToIdle, 1600);
}

function returnToIdle() {
  phase = 'idle';
  holding = false;
  showFightUI(false);
  updateHUD();
  setStatus('點擊水面拋竿，開始釣魚！');
}

function selectSpot(id) {
  const spot = SPOTS[id];
  if (state.spotsUnlocked[id]) {
    startFade(id);
  } else if (state.coins >= unlockPrice(spot)) {

  } else {

}

/* ---------- 水體粒子系統 ---------- */
let waterParticles = [];
let waterParticlesOn = true;   // 粒子顯示開關

// 釣竿專屬粒子效果（竿尖環繞，依魚竿類型不同顏色）
function spawnRodFx() {

// 各區域的粒子生成（方向、速度、密度各有差異）
function spawnRegionWater() {
  const spot = state.currentSpot;
  const flow = flowSpeed();
  const wl = waterLeft();
  if (spot === 'sea') {
    if (Math.random() < 0.3) waterParticles.push({ type:'ripple', x: wl + Math.random() * (LW - wl), y: waterY + 1 + Math.random() * 3, vx: flow * 0.5, vy: 0, size: 2 + Math.random() * 3, alpha: 0.15, life: 3, maxLife: 3 });
    if (Math.random() < 0.08) waterParticles.push({ type:'mist', x: wl + Math.random() * (LW - wl), y: waterY + 2, vx: flow, vy: -0.2, size: 4 + Math.random() * 4, alpha: 0.08, life: 4, maxLife: 4 });
    if (Math.random() < 0.2) waterParticles.push({ type:'spray', x: 2 + Math.random() * 4, y: bankTop() + 2 + Math.random() * 2, vx: 2, vy: -2 - Math.random() * 2, size: 1, alpha: 0.5, life: 0.6, maxLife: 0.6 });
    // 船尾尾跡
    const sternX = state.boatDir === 'right' ? 0 : landW + 4;
    const wakeDir = state.boatDir === 'right' ? -0.6 : 0.6;
    if (Math.random() < 0.4) waterParticles.push({ type:'mist', x: sternX, y: bankTop() + 2, vx: wakeDir, vy: 0.1, size: 2 + Math.random() * 3, alpha: 0.12, life: 3, maxLife: 3 });
  } else if (spot === 'sky') {
    if (Math.random() < 0.4) waterParticles.push({ type:'mist', x: wl + Math.random() * (LW - wl), y: waterY - 1 + Math.random() * 3, vx: flow + 0.3, vy: -0.15, size: 5 + Math.random() * 6, alpha: 0.10, life: 5, maxLife: 5 });
    if (Math.random() < 0.15) waterParticles.push({ type:'glint', x: wl + Math.random() * (LW - wl), y: waterY + 1 + Math.random() * 3, vx: flow, vy: 0, size: 1, alpha: 0.5, life: 2, maxLife: 2 });
  } else if (spot === 'pier') {

    if (Math.random() < 0.2) waterParticles.push({ type:'bubble', x: 3 + Math.random() * (landW + 3), y: waterY + 4 + Math.random() * 4, vx: flow * 0.3, vy: -1.5, size: 1, alpha: 0.4, life: 2, maxLife: 2 });
    if (Math.random() < 0.2) waterParticles.push({ type:'glint', x: wl + Math.random() * (LW - wl), y: waterY + 2 + Math.random() * 3, vx: flow * 0.5, vy: 0, size: 1, alpha: 0.3, life: 2.5, maxLife: 2.5 });

    // 漩渦反光點
    if (Math.random() < 0.1) waterParticles.push({ type:'glint', x: Math.random() * LW, y: waterY + Math.random() * (LH - waterY), vx: flow * 0.3, vy: 0, size: 1, alpha: 0.35, life: 2, maxLife: 2, color: '#7ac8e8' });

function toggleWaterParticles() {
  waterParticlesOn = !waterParticlesOn;
  if (!waterParticlesOn) waterParticles = [];
  showToast('水體粒子：' + (waterParticlesOn ? '開啟' : '關閉'));
  if (panelType) renderPanel(panelType);   // 設置面板即時同步開關狀態
}

function drawWaterParticles() {
  for (const p of waterParticles) {
    const t = 1 - p.life / p.maxLife;
    if (p.type === 'ripple') {
      const r = Math.round(p.size + t * 5);
      ctx.fillStyle = 'rgba(255,255,255,' + (p.alpha * (1 - t)) + ')';
      const pts = [[1,0],[-1,0],[0,1],[0,-1],[0.7,0.7],[0.7,-0.7],[-0.7,0.7],[-0.7,-0.7]];
      for (const [dx,dy] of pts) ctx.fillRect(Math.round(p.x + dx * r) * S, Math.round(p.y + dy * r) * S, S, S);
    } else if (p.type === 'spray' || p.type === 'bubble') {
      ctx.fillStyle = 'rgba(215,238,255,' + (p.alpha * (1 - t)) + ')';
      ctx.fillRect(Math.round(p.x) * S, Math.round(p.y) * S, p.size * S, p.size * S);
    } else if (p.type === 'mist') {
      ctx.fillStyle = 'rgba(210,220,230,' + (p.alpha * (1 - t)) + ')';
      ctx.fillRect(Math.round(p.x) * S, Math.round(p.y) * S, p.size * S, Math.max(1, Math.round(p.size / 2)) * S);
    } else if (p.type === 'glint') {
      const tw = 0.5 + 0.5 * Math.sin(p.life * 6);
      const [r, g, b] = hexToRgb(p.color || '#ffffff');
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (p.alpha * tw) + ')';
      ctx.fillRect(Math.round(p.x) * S, Math.round(p.y) * S, S, S);
    }
  }
}

// 隨機事件視覺特效
function drawEventFx() {
  for (const e of fx) {
    if (e.type === 'jump') {
      const p = e.t / e.dur;
      const y = waterY - 8 - Math.sin(p * Math.PI) * 6;
      drawFish(e.fishId, e.x, y, 1, e.t);
    } else if (e.type === 'birds') {
      ctx.fillStyle = 'rgba(50,50,62,0.8)';
      for (let i = 0; i < 4; i++) {
        const bx = ((e.t * 8 + i * 12) % LW);
        const by = waterY - 14 - i * 2 + Math.round(Math.sin(e.t * 2 + i) * 1);
        ctx.fillRect(Math.round(bx) * S, Math.round(by) * S, 2 * S, S);
      }
    } else if (e.type === 'star') {
      const p = e.t / e.dur;
      const x = e.x + p * 20, y = e.y + p * 10;
      ctx.fillStyle = 'rgba(255,255,220,0.9)';
      ctx.fillRect(Math.round(x) * S, Math.round(y) * S, 2 * S, S);
    }
  }
}

function updateMotes(dt) {
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt;
    if (m.life <= 0) motes.splice(i, 1);
  }
}
function updateFireflies(dt) {
  for (let i = fireflies.length - 1; i >= 0; i--) {
    const f = fireflies[i];
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
    if (f.life <= 0) fireflies.splice(i, 1);
  }
}
function updateLeaves(dt) {
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.x += l.vx * dt + Math.sin(l.ph + performance.now() / 1000 * 2) * 0.5 * dt;
    l.y += l.vy * dt; l.life -= dt;
    if (l.life <= 0 || l.y > waterY) leaves.splice(i, 1);
  }
}
function drawMotes(t) {
  for (const m of motes) {
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 3 + m.ph));
    ctx.fillStyle = 'rgba(255,248,210,' + (0.5 * tw * (m.life / m.maxLife)).toFixed(3) + ')';
    ctx.fillRect(Math.round(m.x) * S, Math.round(m.y) * S, S, S);
  }
}
function drawFireflies(t) {
  for (const f of fireflies) {
    const tw = 0.5 + 0.5 * Math.sin(t * 2.5 + f.ph);
    ctx.fillStyle = 'rgba(220,255,140,' + (0.7 * tw * (f.life / f.maxLife)).toFixed(3) + ')';
    ctx.fillRect(Math.round(f.x) * S, Math.round(f.y) * S, S, S);
    ctx.fillRect(Math.round(f.x) * S, Math.round(f.y + 1) * S, S, S);
  }
}
function drawLeaves() {
  for (const l of leaves) {
    ctx.globalAlpha = Math.min(1, l.life / 2);
    ctx.fillStyle = l.color;
    ctx.fillRect(Math.round(l.x) * S, Math.round(l.y) * S, S, S);
  }
  ctx.globalAlpha = 1;
}
function drawLightningFlash() {
  if (flash <= 0.01) return;
  ctx.fillStyle = 'rgba(220,235,255,' + (flash * 0.45).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

/* ---------- 九、商店 / 背包 / 地圖操作 ---------- */

// 取得某物件中指定 key 的前一個 key（依插入順序，代表解鎖順序）；第一個回傳 null
function prevKey(obj, id) {
  const keys = Object.keys(obj);
  const i = keys.indexOf(id);
  return i > 0 ? keys[i - 1] : null;
}

function buyRod(id) {
  const rod = RODS[id];
  if (state.rodsOwned[id]) { showToast('已經擁有這支魚竿了。', 'bad'); return; }
  const prev = prevKey(RODS, id);
  if (prev && !state.rodsOwned[prev]) { showToast(`需先擁有「${RODS[prev].name}」才能購買這支魚竿。`, 'bad'); return; }
  if (state.coins < rod.cost) { showToast('金幣不足。', 'bad'); return; }
  state.coins -= rod.cost;
  state.rodsOwned[id] = true;
  saveGame(); sfxBuy();
  updateHUD(); renderPanel(panelType);
}

function buyBait(id) {
  const bait = BAITS[id];
  if (state.coins < bait.cost) { showToast('金幣不足。', 'bad'); return; }
  state.coins -= bait.cost;
  state.baits[id] += bait.bundle;   // 一次補充一包使用次數
  saveGame(); sfxBuy();
  updateHUD(); renderPanel(panelType);
}

function buyItem(id) {
  const it = ITEMS[id];
  if (state.coins < it.cost) { showToast('金幣不足。', 'bad'); return; }
  state.coins -= it.cost;
  state.items[id]++;
  saveGame(); sfxBuy();
  updateHUD(); renderPanel(panelType);
}

function useItem(id) {
  if (state.items[id] <= 0) { showToast('你沒有這個道具。', 'bad'); return; }
  state.items[id]--;
  pendingItem = id;   // 下次釣魚生效
  saveGame(); sfxBuy();
  updateHUD(); renderPanel(panelType);
  showToast('已使用「' + ITEMS[id].name + '」，下次釣魚生效。', 'ok');
}

function equipRod(id) {
  if (!state.rodsOwned[id]) return;
  state.currentRod = id;
  saveGame(); updateHUD(); renderPanel(panelType);
}

function equipBait(id) {
  if (state.baits[id] <= 0) { showToast('這個魚餌用完了，去商店補充。', 'bad'); return; }
  state.currentBait = id;
  saveGame(); updateHUD(); renderPanel(panelType);
}

function unlockSpot(id) {
  const spot = SPOTS[id];
  if (state.spotsUnlocked[id]) return true;
  const prev = prevKey(SPOTS, id);
  if (prev && !state.spotsUnlocked[prev]) { showToast(`需先解鎖「${SPOTS[prev].name}」才能解鎖此地圖。`, 'bad'); return false; }
  // 圖鑑進度門檻：需先捕獲前一個釣點的指定魚種數
  const req = SPOT_REQ_FISH[id] || 0;
  if (req > 0 && prev) {
    const caught = countCaughtInSpot(prev);
    if (caught < req) {
      showToast(`需先在前一個釣點「${SPOTS[prev].name}」捕獲 ${req} 種魚（目前 ${caught}/${req}）。`, 'bad');
      return false;
    }
  }
  const cost = unlockPrice(spot);
  if (state.coins < cost) { showToast('金幣不足。', 'bad'); return false; }
  state.coins -= cost;
  state.spotsUnlocked[id] = true;
  saveGame(); sfxUnlock();
  updateHUD(); renderPanel(panelType);
  checkAchievements();
  return true;
}

function sellFish(id) {
  if (state.fishCaught[id] <= 0) return;
  const price = FISH[id].price;
  state.coins += Math.round(price * marketRate());   // 魚市價格波動
  state.fishCaught[id]--;
  saveGame(); sfxSell();
  updateHUD(); renderPanel(panelType);
}

function sellAllFish() {
  let total = 0;
  const rate = marketRate();
  for (const id in state.fishCaught) { total += Math.round(state.fishCaught[id] * FISH[id].price * rate); state.fishCaught[id] = 0; }
  if (total === 0) { showToast('魚簍是空的。'); return; }
  state.coins += total;
  saveGame(); sfxSell();
  updateHUD(); renderPanel(panelType);
}

function updateFightUI() {
  const rod = RODS[state.currentRod];
  const dur = LINE_DURABILITY;
  const tf = clamp(fight.tension / dur, 0, 1);
  const zl = clamp(fight.zoneLow / dur, 0, 1);

  const pf = fight.progress / 100;

  mark.style.background = inZone ? '#ffffff' : '#ff5555';   // 區內白、偏離紅

  const pb = byId('progressBar'), timeBar = byId('timeBar');
  pb.style.width = (pf * 100).toFixed(1) + '%';
  timeBar.style.width = (timeF * 100).toFixed(1) + '%';

// 圖鑑進度門檻：解鎖某釣點前，需已在「前一個釣點」捕獲此數量的魚種（fishFound 記錄）
const SPOT_REQ_FISH = { lake:3, swamp:4, pier:4, sea:4, sky:4, glow:4, underwater:4 };

// 計算某釣點魚池中已被捕獲（fishFound > 0）的魚種數
function countCaughtInSpot(spotId) {
  const pool = SPOTS[spotId] && SPOTS[spotId].fish;
  if (!pool) return 0;
  let n = 0;
  for (const id in pool) if (state.fishFound[id] > 0) n++;
  return n;
}

// 解鎖費（提高門檻：直接採用原始 unlockCost，不再打折）
function unlockPrice(s) { return Math.round(s.unlockCost); }

// 魚市價格波動（0.85~1.10，多數時候略低於基礎價，延長遊戲時長）
function marketRate() {
  const t = performance.now() / 1000;
  return 0.9 + 0.15 * (0.5 + 0.5 * Math.sin(t * 0.06)) + 0.05 * Math.sin(t * 0.5);
}

// 成就檢查（釣到魚、解鎖釣點後呼叫）
function checkAchievements() {
  let unlocked = false;
  for (const a of ACHIEVEMENTS) {
    if (state.achievements[a.id]) continue;
    let ok = false;
    if (a.id === 'first_fish') ok = state.totalCaught >= 1;
    else if (a.id === 'catch_50') ok = state.totalCaught >= 50;
    else if (a.id === 'catch_200') ok = state.totalCaught >= 200;
    else if (a.id === 'all_maps') ok = Object.values(state.spotsUnlocked).every(v => v);
    else if (a.id === 'all_fish') ok = Object.keys(FISH).every(id => state.fishFound[id] > 0);
    else if (a.id === 'legend') ok = Object.keys(FISH).some(id => FISH[id].rarity === '傳說' && state.fishFound[id] > 0);
    if (ok) {
      state.achievements[a.id] = true;
      state.coins += a.reward;
      showToast(`🏆 成就解鎖【${a.name}】！獎勵 ${a.reward} 金幣`, 'ok', 4000);
      unlocked = true;
    }
  }
  if (unlocked) saveGame();   // 只在有成就解鎖時存檔，避免重複寫入
}

// 魚竿屬性顯示（拉力/掙扎耐受/浮漂靈敏＋特殊效果）
function rodAttrs(r) {
  const attrs = `拉力 ${r.reel}｜掙扎耐受 +${Math.round(r.resist * 100)}%｜浮漂靈敏 +${Math.round(r.float * 100)}%`;
  const eff = r.special ? `<div class="tag">✦ ${SPECIAL_EFFECTS[r.special]}</div>` : '';
  return `<div class="muted">${attrs}</div>${eff}`;
