<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>釣魚遊戲</title>
<style>
  /* ===== 整體風格：清爽像素海洋（類似潛水員戴夫） ===== */
  * { box-sizing: border-box; }
  /* 通用隱藏類別：所有遮罩/視窗/提示都靠它控制顯示，缺少會讓全螢幕遮罩一直蓋住按鈕 */
  .hidden { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #0c1220;
    color: #eaf2ff;
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas#scene { position: fixed; inset: 0; display: block; }

  /* ===== 上方資訊列 ===== */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 12px; z-index: 20;
    background: rgba(16,22,36,0.72);
    border-bottom: 2px solid #4a5f86;
  }
  .hud-title { font-weight: bold; color: #ffd75e; margin-right: 4px; font-size: 16px; }
  .chip {
    background: rgba(0,0,0,0.35); border: 1px solid #4a5f86;
    padding: 3px 8px; border-radius: 3px; font-size: 13px; white-space: nowrap;
  }
  .chip b { color: #ffd75e; }
  .spacer { flex: 1; }
  button {
    font-family: inherit; cursor: pointer; font-size: 13px;
    background: #3a4a6a; color: #eaf2ff;
    border: 2px solid #6a7aa0; border-radius: 3px; padding: 5px 10px;
  }
  button:hover { background: #4a5f86; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }
  .x-btn { background: #6a3040; border-color: #a05a6a; padding: 3px 10px; }
  input[type=range] { accent-color: #ffd75e; }
  input[type=number] { background: #141c2a; color: #eaf2ff; border: 1px solid #4a5f86; padding: 3px 6px; font-family: inherit; }

  /* ===== 拉扯進度條 ===== */
  #fightUI {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
    width: min(440px, 84vw); z-index: 25;
    background: rgba(12,18,28,0.82); border: 2px solid #4a5f86; border-radius: 4px;
    padding: 10px 14px;
  }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .bar-row span { width: 46px; font-size: 14px; }
  .bar {
    flex: 1; height: 16px; background: #0c1220;
    border: 2px solid #4a5f86; border-radius: 3px; overflow: hidden; position: relative;
  }
  #progressBar, #timeBar { height: 100%; width: 0%; background: #4ade80; }
  .zone { position: absolute; top: 0; bottom: 0; background: #4ade80; opacity: 0.45; }
  .mark { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #ffffff; border-radius: 1px; }
  .reel-btn {
    display: block; margin: 8px auto 2px; padding: 12px 26px; font-size: 16px;
    background: #f87171; border-color: #ffd0d0; font-weight: bold;
  }

  /* ===== 底部狀態列 ===== */
  #statusbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; flex-wrap: wrap;
  }
  #status { flex: 1; text-align: right; font-size: 13px; color: var(--foam, #cfe8f5); }

  /* ===== 結果提示 ===== */
  #toast {
    position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
    z-index: 40; padding: 14px 24px; border-radius: 4px; font-size: 18px;
    text-align: center; background: rgba(12,18,28,0.92); border: 3px solid #6a7aa0;
  }
  #toast.ok { border-color: #7fd08a; }
  #toast.bad { border-color: #f87171; }

  /* ===== 彈出視窗 ===== */
  #panelBackdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 30;
  }
  #panelBox {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: min(540px, 94vw); max-height: 82vh; overflow: auto;
    background: #1c2434; border: 3px solid #4a5f86; border-radius: 4px; z-index: 31;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #253047; color: #ffd75e;
    font-weight: bold; font-size: 18px; border-bottom: 2px solid #4a5f86;
    position: sticky; top: 0;
  }
  .panel-body { padding: 12px 14px; }
  .panel-body h3 { margin: 14px 0 6px; color: #8ec9ff; font-size: 15px; }
  .card {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: #141c2a; border: 2px solid #3a4a6a; border-radius: 3px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .card b { color: #fff; }
  .card .rarity { font-size: 12px; padding: 1px 6px; border-radius: 2px; margin-left: 4px; }
  .r-普通 { background: #5a6a7a; }
  .r-稀有 { background: #3a7ab8; }
  .r-大魚 { background: #8a4a9a; }
  .r-傳說 { background: #c88800; }
  .muted { color: #8a93b8; font-size: 12px; }
  .tag { color: #ffd75e; }
  .btn-row { display: flex; gap: 6px; flex-shrink: 0; }
  .help-line { margin: 6px 0; font-size: 14px; }
  .help-line kbd {
    background: #3a4a6a; border: 1px solid #6a7aa0; border-radius: 3px;
    padding: 1px 7px; font-family: inherit;
  }

  /* ===== 像素風美化：邊框、背景紋理、動畫過渡 ===== */
  #panelBox { animation: panelIn 0.18s ease; }
  @keyframes panelIn { from { opacity: 0; transform: translate(-50%, -48%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .panel-body {
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 4px);
  }
  .panel-body h3 { border-bottom: 2px solid #3a4a6a; padding-bottom: 3px; }
  .card {
    border: 2px solid #4a5f86;
    box-shadow: inset 0 0 0 1px #0c1220, 0 2px 0 #0c1220;
    transition: background 0.12s, transform 0.12s;
  }
  .card:hover { background: #1a2436; transform: translateY(-1px); }
  .enc-card canvas { image-rendering: pixelated; background: #10141f; border: 2px solid #4a5f86; flex-shrink: 0; }
  .enc-card { align-items: center; }

  /* ===== 主選單 / 存檔選擇 / 劇情 / 介紹 ===== */
  .menu-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,10,20,0.94);
  }
  #saveSelect, #storyOverlay, #introOverlay { z-index: 55; }
  #storyOverlay { z-index: 60; }
  .menu-box {
    width: min(560px, 94vw); max-height: 90vh; overflow: auto;
    background: #1c2434; border: 3px solid #4a5f86; border-radius: 4px;
    padding: 24px; text-align: center;
    animation: panelIn 0.2s ease;
  }
  .menu-title { font-size: 30px; color: #ffd75e; font-weight: bold; margin: 12px 0 4px; }
  .menu-sub { color: #8a93b8; margin-bottom: 16px; }
  .menu-btn {
    display: block; width: 100%; margin: 8px 0; padding: 14px; font-size: 18px;
    background: #3a4a6a; color: #eaf2ff; border: 2px solid #6a7aa0; border-radius: 3px;
    cursor: pointer; font-family: inherit;
  }
  .menu-btn:hover { background: #4a5f86; }
  .story-box { text-align: left; }
  .story-text { text-align: left; line-height: 1.9; color: #eaf2ff; font-size: 15px; margin: 16px 0; white-space: normal; }
  .story-text h3 { color: #8ec9ff; margin: 12px 0 4px; font-size: 15px; }
  .story-text p { margin: 0 0 8px; color: #c8d0e0; }
  #coverCanvas { image-rendering: pixelated; border: 3px solid #4a5f86; margin-bottom: 8px; max-width: 100%; }
  #victoryCanvas { image-rendering: pixelated; border: 3px solid #ffd75e; margin-bottom: 8px; max-width: 100%; }

  /* ===== 《漁夫瑟蘭》海洋水色主題 UI ===== */
  :root {
    --sea-deep: #0a2038;
    --sea: #123a5c;
    --lake: #1a4a6a;
    --seagreen: #1a6a6a;
    --cyan: #3fb8d8;
    --cyan-bright: #5fd0f0;
    --water: rgba(16, 42, 66, 0.74);
    --water-clear: rgba(32, 74, 108, 0.5);
    --foam: #e8f4ff;
    --outline: #0a1a2a;
    --gold: #ffd75e;
  }

  /* 半透明水體面板：冰晶四角＋水波暗紋＋海面折射＋浪花框 */
  #panelBox, .menu-box, #toast, #statusbar, #fightUI {
    background:
      radial-gradient(circle at 8px 8px, var(--foam) 2px, transparent 3px),
      radial-gradient(circle at calc(100% - 8px) 8px, var(--foam) 2px, transparent 3px),
      radial-gradient(circle at 8px calc(100% - 8px), var(--foam) 2px, transparent 3px),
      radial-gradient(circle at calc(100% - 8px) calc(100% - 8px), var(--foam) 2px, transparent 3px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 7px),
      linear-gradient(180deg, var(--water-clear), var(--water));
    border: 3px solid var(--outline);
    box-shadow: inset 0 0 0 2px var(--cyan), 0 4px 0 rgba(0,0,0,0.4);
    color: #eaf6ff;
  }
  .panel-head {
    background: linear-gradient(180deg, var(--lake), var(--sea));
    border-bottom: 2px solid var(--cyan);
    color: var(--cyan-bright);
    text-shadow: 0 0 6px rgba(63,184,216,0.85);
  }
  /* 海面折射紋理＋水波暗紋 */
  .panel-body, .story-box {
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 9px),
      radial-gradient(circle at 50% 120%, transparent 55%, rgba(255,255,255,0.05) 58%, transparent 62%);
    background-size: auto, 16px 10px;
    background-color: rgba(8, 24, 42, 0.6);
  }
  .panel-body h3, .story-text h3 {
    color: var(--cyan-bright);
    border-bottom: 2px solid var(--cyan);
    padding-bottom: 3px;
  }
  .panel-body h3::before { content: '🪝 '; }

  /* 卡片：水波暗紋＋青藍框 */
  .card {
    background:
      radial-gradient(circle at 5px 5px, var(--foam) 1.5px, transparent 2.5px),
      radial-gradient(circle at calc(100% - 5px) 5px, var(--foam) 1.5px, transparent 2.5px),
      radial-gradient(circle at 5px calc(100% - 5px), var(--foam) 1.5px, transparent 2.5px),
      radial-gradient(circle at calc(100% - 5px) calc(100% - 5px), var(--foam) 1.5px, transparent 2.5px),
      linear-gradient(180deg, rgba(26,74,106,0.7), rgba(12,38,62,0.7));
    border: 2px solid var(--cyan);
    box-shadow: inset 0 0 0 1px var(--outline);
    transition: background 0.12s, transform 0.12s;
  }
  .card:hover { background-color: rgba(42,100,140,0.8); transform: translateY(-1px); }
  .card b { color: #eaf6ff; }
  .card .muted { color: #a8c8e0; }
  .card .tag { color: var(--gold); }

  /* 按鈕：水藍漸層＋深海藍描邊；重要按鈕青色高亮 */
  button, .menu-btn {
    background: linear-gradient(180deg, var(--cyan), var(--lake));
    border: 2px solid var(--outline);
    box-shadow: inset 0 0 0 1px #cfefff, 0 2px 0 var(--outline);
    color: #f0fbff;
    transition: transform 0.06s, filter 0.12s;
  }
  button:hover, .menu-btn:hover { filter: brightness(1.12); }
  button:active, .menu-btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px #cfefff; }
  button:disabled { filter: grayscale(0.5) brightness(0.7); }
  .x-btn { background: linear-gradient(180deg, #c85a5a, #8a3030); border-color: #3a1a1a; }
  .reel-btn { background: linear-gradient(180deg, #f0a080, #c05840); border-color: #6a2a1a; }

  /* HUD：半透明深海藍 */
  #hud {
    background: linear-gradient(180deg, rgba(10,32,56,0.9), rgba(18,58,92,0.8));
    border-bottom: 2px solid var(--cyan);
  }
  .chip {
    background: rgba(8,24,42,0.6);
    border: 1px solid var(--cyan);
    box-shadow: inset 0 0 0 1px var(--outline);
  }
  .chip b { color: var(--gold); }
  .hud-title { color: var(--cyan-bright); text-shadow: 0 0 6px rgba(63,184,216,0.85); }

  /* 進度條：海水漸層 */
  .bar { background: rgba(4,12,22,0.9); border: 2px solid var(--cyan); }
  #progressBar, #timeBar { background: linear-gradient(90deg, #2a7aa8, #5fc8e8); }
  .zone { background: linear-gradient(90deg, #2a9a6a, #5fd0a0); opacity: 0.5; }
  .mark { background: #fff; }

  /* 結果提示 */
  #toast { border: 3px solid var(--outline); box-shadow: inset 0 0 0 2px var(--cyan); color: #eaf6ff; }
  #toast.ok { box-shadow: inset 0 0 0 2px #5fd0a0; }
  #toast.bad { box-shadow: inset 0 0 0 2px #f09880; }

  /* 輸入框 */
  input[type=range] { accent-color: var(--cyan); }
  input[type=number] { background: rgba(8,24,42,0.6); color: #eaf6ff; border: 1px solid var(--cyan); }

  /* 滑桿與面板動畫 */
  #panelBox, .menu-box { animation: panelIn 0.2s ease; }
  .rarity { font-weight: bold; }

  /* UI 顯示/隱藏切換（快捷鍵 H） */
  body.ui-hidden #hud,
  body.ui-hidden #statusbar,
  body.ui-hidden #fightUI,
  body.ui-hidden #toast { display: none !important; }

  /* 地圖卡片預覽縮圖 */
  .map-card { align-items: center; }
  .map-card canvas { image-rendering: pixelated; border: 2px solid var(--cyan); background: #082036; flex-shrink: 0; }

  /* UI 動畫效果 */
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) scale(0.85); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  #toast:not(.hidden) { animation: toastIn 0.22s ease; }
  .chip b { display: inline-block; }
  .num-pop { animation: numPop 0.35s ease; }
  @keyframes numPop { 0% { transform: scale(1); } 40% { transform: scale(1.3); color: #ffd75e; } 100% { transform: scale(1); } }
  .panel-body > * { animation: contentFade 0.2s ease; }
  @keyframes contentFade { from { opacity: 0; } to { opacity: 1; } }
  button kbd {
    background: rgba(8,24,42,0.6); border: 1px solid var(--cyan);
    border-radius: 3px; padding: 0 5px; font-size: 11px; font-family: inherit; color: var(--cyan-bright);
  }
  .panel-body h4 { color: var(--cyan-bright); margin: 10px 0 4px; font-size: 14px; border-bottom: 1px solid var(--cyan); padding-bottom: 2px; }

  /* 極簡主選單 / 通關畫面（無方框，深色半透明底襯，內容置中偏下） */
  .menu-minimal { background: rgba(6,12,22,0.52); align-items: flex-end; padding-bottom: 13vh; }
  .menu-center { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .menu-primary { width: auto; min-width: 230px; font-size: 19px; }
  .menu-link { background: transparent; border: none; box-shadow: none; color: #a8d8f0; font-size: 15px; cursor: pointer; text-decoration: underline; }
  .victory-story { max-width: 660px; color: #eaf6ff; font-size: 15px; line-height: 1.9; text-align: center; margin: 6px 20px; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
  .asset-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .asset-item { text-align: center; width: 116px; }
  .er-row { display: grid; grid-template-columns: 1.3fr 0.7fr 0.8fr 1.4fr; gap: 8px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .er-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .er-head { color: #8ec9ff; font-size: 12px; font-weight: bold; border-bottom-color: rgba(120,200,255,0.3); }
  .asset-canvas { image-rendering: pixelated; background: #082036; border: 2px solid var(--cyan); max-width: 100%; height: auto; }

  /* ===== 簡潔海洋水紋 UI：無邊框、白色文字、海洋紋理底襯 ===== */
  #panelBox, .menu-box, #toast, #statusbar, #fightUI,
  .card, button, .menu-btn, .chip, .bar, .panel-head, .help-line kbd,
  .enc-card canvas, .map-card canvas, .asset-canvas { border: none; box-shadow: none; }
  .panel-body h3, .panel-body h4, .story-text h3, .story-text h4 { border-bottom: none; }

  /* 面板：淡藍水波底襯＋海浪紋 */
  #panelBox, .menu-box, #toast, #statusbar, #fightUI {
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 11px),
      linear-gradient(180deg, rgba(36,78,112,0.85), rgba(14,40,64,0.9));
  }
  .panel-head { background: linear-gradient(180deg, rgba(30,66,96,0.9), rgba(18,48,76,0.9)); }

  /* 卡片：貝殼紋（弧形鱗紋）＋水色底 */
  .card {
    background:
      radial-gradient(circle at 50% 120%, transparent 52%, rgba(255,255,255,0.06) 56%, transparent 60%),
      linear-gradient(180deg, rgba(30,64,92,0.6), rgba(14,36,58,0.7));
    background-size: 22px 14px, auto;
  }

  /* 內容區：珊瑚點紋＋水色底 */
  .panel-body, .story-box {
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04) 1px, transparent 1.5px),
      linear-gradient(180deg, rgba(12,32,52,0.55), rgba(8,22,38,0.65));
    background-size: 11px 11px, auto;
  }

  /* 按鈕：水藍漸層 */
  button, .menu-btn { background: linear-gradient(180deg, rgba(63,184,216,0.9), rgba(26,74,106,0.9)); }
  .menu-link { background: transparent; }

  /* 晶片與進度條：淡藍水色 */
  .chip { background: rgba(18,46,72,0.7); }
  .bar { background: rgba(6,16,28,0.85); }
  #toast, #statusbar { background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 11px),
    linear-gradient(180deg, rgba(30,64,92,0.85), rgba(14,40,64,0.9)); }

  /* 文字統一白色 */
  .menu-title, .hud-title, .panel-head, .card b, .chip b, .tag, .rarity { color: #ffffff; text-shadow: none; }
  .card .muted, .menu-sub, .status-msg, .victory-story, .help-line,
  .panel-body h3, .panel-body h4, .story-text h3, .story-text h4, .story-text p { color: #eaf2fa; }

  /* ===== 封面標題排版（中央偏上、像素字體、深藍像素描邊、深海奇幻感） ===== */
  .menu-minimal {
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 10px),
      rgba(6,14,26,0.55);
  }

  /* 主選單：封面採「標題區塊（中央偏上）＋按鈕區塊（畫面最底）」兩區定位 */
  #mainMenu { align-items: center; justify-content: center; padding: 0; }
  #mainMenu .menu-title-block {
    position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%);
    width: 100%; padding: 0 4vw; gap: 14px;
  }
  #mainMenu .menu-actions {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 100%; gap: 6px;
  }

  /* 封面標題：改用像素字體貼圖（cover-title-pixel.png，透明底，放大保持像素鋸齒） */
  #mainMenu .menu-title-img {
    width: 100%;
    max-width: 1800px;
    height: auto;
    display: block;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* 封面按鈕：無邊框、無底色，僅白色文字＋輕微 hover 光暈 */
  #mainMenu .menu-btn,
  #mainMenu .menu-link {
    border: none;
    background: transparent;
    box-shadow: none;
    color: #ffffff;
    text-decoration: none;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    padding: 10px 20px;
    width: auto;
  }
  #mainMenu .menu-primary { font-size: clamp(19px, 2.4vw, 26px); min-width: 0; }
  #mainMenu .menu-link { font-size: clamp(15px, 1.8vw, 19px); }
  #mainMenu .menu-btn:hover,
  #mainMenu .menu-link:hover {
    background: transparent;
    filter: none;
    color: #bfe9ff;
    text-shadow: 0 0 14px rgba(120,210,255,0.95), 0 2px 8px rgba(0,0,0,0.8);
  }
  #mainMenu .menu-btn:active,
  #mainMenu .menu-link:active {
    transform: translateY(1px);
    box-shadow: none;
    filter: none;
  }

const SAVES_KEY = 'diver_fishing_saves_v3';   // 多存檔系統的 localStorage 鍵（以 JSON 字串儲存）

let state = defaultState();

// 讀取整個存檔索引（結構：{ slots: { slot1: {state, meta}, ... } }）
function getIndex() {
  try {
    const raw = localStorage.getItem(SAVES_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { slots: {} };
}
function writeIndex(idx) {
  try { localStorage.setItem(SAVES_KEY, JSON.stringify(idx)); } catch (e) {}
}

// 把目前遊戲狀態打包成一個存檔（state + meta）
function packSave() {
  return {
    state: JSON.parse(JSON.stringify(state)),   // 深拷貝，避免之後被改動
    meta: { lastSaved: Date.now() },
  };
}

// 自動存檔：寫入目前所在的存檔欄位（關頁、釣到魚、買賣、切釣點時呼叫）
function saveGame() {
  if (resetting) return;   // 修復：重置中不寫入，避免重置後進度又被自動存檔寫回
  if (!currentSlot) currentSlot = 'slot1';
  const idx = getIndex();
  idx.slots[currentSlot] = packSave();
  writeIndex(idx);
}

// 手動存到指定欄位，並把該欄位設為「目前欄位」
function saveToSlot(slot) {
  currentSlot = slot;
  saveGame();
  renderPanel(panelType);
}

// 從指定欄位讀取
function loadFromSlot(slot) {
  const idx = getIndex();
  const rec = idx.slots[slot];
  if (!rec || !rec.state) { showToast('這個存檔是空的。', 'bad'); return; }
  applyLoadedState(rec.state);
  currentSlot = slot;
  afterLoadState();
  closePanel();
}

// 刪除指定欄位
function deleteSlot(slot) {
  const idx = getIndex();
  delete idx.slots[slot];
  writeIndex(idx);
  if (currentSlot === slot) currentSlot = Object.keys(idx.slots)[0] || null;   // 改到剩下的欄位
  renderPanel(panelType);
}

// 把載入的存檔合併進預設值（避免舊存檔缺少新欄位）
function applyLoadedState(saved) {
  const d = defaultState();
  // 修復：用「全新物件」合併。之前 `Object.assign(d, saved)` 會先覆寫巢狀物件，
  // 導致後續 `Object.assign(d.baits, saved.baits)` 變成自己合併自己，遺失預設欄位（如 worm）
  state = Object.assign({}, d, saved);
  state.spotsUnlocked = Object.assign({}, d.spotsUnlocked, saved.spotsUnlocked || {});
  state.rodsOwned = Object.assign({}, d.rodsOwned, saved.rodsOwned || {});
  state.baits = Object.assign({}, d.baits, saved.baits || {});
  state.fishCaught = Object.assign({}, d.fishCaught, saved.fishCaught || {});
  state.fishFound = Object.assign({}, d.fishFound, saved.fishFound || {});
  // 回填：舊存檔沒有 fishFound，凡魚簍仍有的魚都視為已捕獲過（賣魚後不會消失）
  for (const id in FISH) if (state.fishCaught[id] > 0) state.fishFound[id] = 1;
  state.items = Object.assign({}, d.items, saved.items || {});
  state.seenStories = Object.assign({}, saved.seenStories || {});
  state.achievements = Object.assign({}, saved.achievements || {});
  state.stats = Object.assign({}, d.stats, saved.stats || {});
  state.keybinds = Object.assign({}, DEFAULT_KEYBINDS, saved.keybinds || {});
  normalizeBait();
}

// 修正魚餌欄位：確保每個魚餌都是有效數字、目前裝備的魚餌可用
function normalizeBait() {
  for (const id in BAITS) {
    const v = state.baits[id];
    state.baits[id] = (typeof v === 'number' && isFinite(v) && v > 0) ? Math.floor(v) : 0;
  }
  if (!state.baits[state.currentBait] || state.baits[state.currentBait] <= 0) {
    const alt = ['worm','shrimp','minnow','lure'].find(b => state.baits[b] > 0);
    state.currentBait = alt || 'worm';
  }
}

// 讀取後重置流程並重新生成場景
function afterLoadState() {
  phase = 'idle'; holding = false;
  showFightUI(false);
  clearTimeout(biteTimer);
  clearTimeout(resultTimer);
  genAmbient();
  updateHUD();
  setStatus('已讀取存檔');
  fade = 1; fading = true; fadeDir = -1;   // 淡入套用新場景
}

// 舊版單一存檔遷移到 slot1（只做一次）
function migrateOldSave() {
  try {
    if (localStorage.getItem(SAVES_KEY)) return;   // 已有新版存檔，跳過
    const old = localStorage.getItem(OLD_KEY);
    if (!old) return;
    const saved = JSON.parse(old);
    const idx = { slots: {} };
    idx.slots['slot1'] = { state: saved, meta: { lastSaved: Date.now() } };
    writeIndex(idx);
    localStorage.removeItem(OLD_KEY);
  } catch (e) {}
}

// 啟動時讀取：優先載入「最近一次儲存」的欄位
function loadGame() {
  migrateOldSave();
  const idx = getIndex();
  let latest = null, latestTime = -1;
  for (const key in idx.slots) {
    const rec = idx.slots[key];
    if (rec && rec.meta && rec.meta.lastSaved > latestTime) {
      latestTime = rec.meta.lastSaved;
      latest = key;
    }
  }
  if (latest && idx.slots[latest].state) {
    currentSlot = latest;
    applyLoadedState(idx.slots[latest].state);
  } else {
    currentSlot = 'slot1';
    state = defaultState();
  }
}

function resetSave() {
  if (confirm('確定要清除所有存檔與遊戲進度嗎？')) {
    resetting = true;   // 修復：設旗標，防止離開頁面時 beforeunload 的自動存檔把進度寫回
    try { localStorage.removeItem(SAVES_KEY); localStorage.removeItem(OLD_KEY); } catch (e) {}
    location.reload();
  }
}

/* ---------- 三、音訊（Web Audio API 全程式生成） ---------- */

let audioCtx = null;
let soundOn = true;
let bgmInterval = null;
let noiseBuf = null;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function canPlay() { return soundOn && audioCtx; }

// 播放一個音（頻率、時長、波形、音量、延遲、可滑音）
function tone(freq, dur, type, vol, when, slideTo) {
  if (!canPlay()) return;
  const t0 = audioCtx.currentTime + (when || 0);
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

// 播放一段雜訊（用於揮竿、斷線）
function noise(dur, vol, when, filterFreq) {
  if (!canPlay()) return;
  if (!noiseBuf) {
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = audioCtx.currentTime + (when || 0);
  const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
  const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t0); src.stop(t0 + dur);
}

// 隨機變調：在基礎頻率加入小幅度隨機偏移，避免音效機械感
function varFreq(freq, amount) {
  return freq * (1 + (Math.random() - 0.5) * (amount || 0.05));
}

// 依地圖＋天氣取得目前 BGM 參數（節拍/音量隨天氣調整）
function currentBGM() {
  const m = MAP_BGM[state.currentSpot] || MAP_BGM.river;
  let stepMul = 1, volMul = 1;
  if (weather.rain > 0.5) { stepMul = 1.12; volMul = 0.82; }        // 大雨
  else if (weather.rain > 0.2) { stepMul = 1.0; volMul = 0.9; }     // 小雨
  else if (weather.cloud > 0.5) { stepMul = 0.88; volMul = 0.9; }   // 陰天
  if (weather.fog > 0.4) { stepMul *= 0.82; volMul *= 0.82; }       // 霧天
  return { scale: m.scale, step: m.step * stepMul, wave: m.wave, octave: m.octave, vol: 0.05 * volMul };
}

let bgmNext = 0, bgmIdx = 0;

function startBGM() {
  if (bgmInterval) return;
  ensureAudio();
  if (!audioCtx) return;
  ensureAmbient();   // 啟動環境音（雨/風/水面）
  bgmNext = audioCtx.currentTime + 0.1;
  bgmInterval = setInterval(() => {
    if (!canPlay()) return;
    const bgm = currentBGM();   // 每次排程讀取目前地圖/天氣，動態切換
    while (bgmNext < audioCtx.currentTime + 0.5) {
      const f = bgm.scale[bgmIdx % bgm.scale.length] * bgm.octave;
      tone(f, bgm.step * 1.2, bgm.wave, bgm.vol, bgmNext - audioCtx.currentTime);
      if (bgmIdx % 4 === 0) tone(f / 2, bgm.step * 2, 'sine', bgm.vol * 0.7, bgmNext - audioCtx.currentTime); // 低音襯底
      // 和弦襯底：每 8 音加一個柔和三和弦（根音/三度/五度）
      if (bgmIdx % 8 === 0) {
        tone(f, bgm.step * 8, 'sine', bgm.vol * 0.5, bgmNext - audioCtx.currentTime);
        tone(f * 1.26, bgm.step * 8, 'sine', bgm.vol * 0.34, bgmNext - audioCtx.currentTime);
        tone(f * 1.5, bgm.step * 8, 'sine', bgm.vol * 0.3, bgmNext - audioCtx.currentTime);
      }
      bgmNext += bgm.step;
      bgmIdx++;
    }
  }, 250);
}
function stopBGM() { clearInterval(bgmInterval); bgmInterval = null; }

// 環境音（雨/風/水面），隨天氣平滑淡入淡出
let rainNode = null, windNode = null, waterNode = null, rainGain = null, windGain = null, waterGain = null;
let ambientTimer = 0.4;

function makeNoiseBuffer() {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function ensureAmbient() {
  if (!audioCtx || rainNode) return;
  rainNode = audioCtx.createBufferSource(); rainNode.buffer = makeNoiseBuffer(); rainNode.loop = true;
  const rf = audioCtx.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 1800;
  rainGain = audioCtx.createGain(); rainGain.gain.value = 0;
  rainNode.connect(rf); rf.connect(rainGain); rainGain.connect(audioCtx.destination);
  rainNode.start();

  windNode = audioCtx.createBufferSource(); windNode.buffer = makeNoiseBuffer(); windNode.loop = true;
  const wf = audioCtx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 350;
  windGain = audioCtx.createGain(); windGain.gain.value = 0;
  windNode.connect(wf); wf.connect(windGain); windGain.connect(audioCtx.destination);
  windNode.start();

  waterNode = audioCtx.createBufferSource(); waterNode.buffer = makeNoiseBuffer(); waterNode.loop = true;
  const waf = audioCtx.createBiquadFilter(); waf.type = 'lowpass'; waf.frequency.value = 480;
  waterGain = audioCtx.createGain(); waterGain.gain.value = 0;
  waterNode.connect(waf); waf.connect(waterGain); waterGain.connect(audioCtx.destination);
  waterNode.start();
}

function updateAmbient() {
  if (!rainGain) return;
  const t = audioCtx.currentTime;
  if (!canPlay()) {   // 靜音時環境音歸零
    rainGain.gain.linearRampToValueAtTime(0, t + 0.4);
    windGain.gain.linearRampToValueAtTime(0, t + 0.4);
    waterGain.gain.linearRampToValueAtTime(0, t + 0.4);
    return;
  }
  const rain = weather.rain > 0.5 ? 0.05 : (weather.rain > 0.2 ? 0.028 : 0);
  const wind = weather.fog > 0.3 ? 0.04 : (weather.cloud > 0.4 ? 0.018 : 0);
  const water = 0.010 + (state.currentSpot === 'sea' ? 0.016 : 0) + (state.currentSpot === 'underwater' ? 0.02 : 0);
  rainGain.gain.linearRampToValueAtTime(rain, t + 2);   // 平滑過渡，避免突變
  windGain.gain.linearRampToValueAtTime(wind, t + 2);
  waterGain.gain.linearRampToValueAtTime(water, t + 2);
}
